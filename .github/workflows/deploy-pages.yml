name: Publish ERA RIVALS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build 100-player position pools
        run: python scripts/build-draft-player-pools.py
      - name: Save generated player database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draft-player-pools.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh 100-player draft pools"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
