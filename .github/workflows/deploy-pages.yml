name: Publish ERA RIVALS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build 100-player position pools
        run: python scripts/build-draft-player-pools.py
      - name: Refresh ESPN roster snapshot when requested
        if: contains(github.event.head_commit.message, '[refresh-rosters]')
        run: |
          python scripts/build-team-rosters.py
          python scripts/refresh-depth-charts.py
      - name: Check draft JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re
          html = pathlib.Path("draft.html").read_text(encoding="utf-8")
          inline = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          if not inline:
              raise SystemExit("No inline draft script found")
          pathlib.Path("/tmp/draft-inline.js").write_text("\n".join(inline), encoding="utf-8")
          PY
          node --check /tmp/draft-inline.js
          node --check draft-player-pools.js
          node --check manager.js
          node --check team-rosters.js
          node --check franchise-engine.js
          node --check franchise-ui.js
          node --check friends-league.js
          node tests/franchise.test.cjs
          node tests/friends-client.test.cjs
      - name: Save generated player database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draft-player-pools.js team-rosters.js
          if ! git diff --cached --quiet; then
            git commit -m "Refresh 100-player draft pools"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
