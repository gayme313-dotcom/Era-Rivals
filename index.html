function draftSlots(sport=app.sport){return LEAGUES[sport].slots}
function eligibleDraft(d){let used=new Set(d.picks.map(p=>p.id));let pool=ALL[d.sport].filter(p=>!used.has(p.id)&&(!d.sport||d.sport==='nba'||(d.sport==='nfl'&&d.slots[d.round]==='FLEX'?(p.pos||[]).some(v=>['RB','WR','TE'].includes(v)):(p.pos||[]).includes(d.slots[d.round]))));if(d.sport==='nba'){if(d.nbaPool==='current')pool=pool.filter(p=>p.season>=2010);let roles=d.nbaRole==='big'?['PF','C']:['PG','SG','SF'];pool=pool.filter(p=>(p.pos||[]).some(v=>roles.includes(v)));}return pool;}
function rollDraft(d,key='init'){
 const options=eligibleDraft(d);if(!options.length)return;
 let random=rng(hash([d.seed,d.round,d.rollIndex,key].join(':')));
 let cat=d.slots[d.round]||'FINAL';
 if(d.sport==='nba'&&d.picks.length===0&&key==='init')d.categories=shuffle(LEAGUES.nba.slots,d.seed);
 if(d.sport==='nba')cat=d.categories?.[d.round]||cat;
 d.category=cat;
 const choose=(a)=>a[Math.floor(random()*a.length)]||a[0];
 let teams=[...new Set(options.map(p=>p.team))];
 if(d.lockedTeam&&teams.includes(d.lockedTeam))d.team=d.lockedTeam;
 else d.team=choose(teams);
 let teamPool=options.filter(p=>p.team===d.team);
 let era=(choose(teamPool)||choose(options)).season;
 d.era=Math.floor(era/10)*10;
 d.boardSeed=[d.seed,d.round,d.rollIndex].join(':');
 d.rerolls={team:1,era:1,stat:1};
 d.revealed=false;
}
function newDraft(mode){if(mode==='coach'){setPage('coach');return}let m=['classic','blind','daily','weekly','auction','playoff','team','season'].includes(mode)?mode:'classic';if(m==='daily'&&app.daily[app.sport+':'+today()]){notify('Daily already completed on this device');return;}if(m==='weekly'&&app.weekly[app.sport+':'+weekKey()]){notify('Weekly challenge already completed on this device');return;}
 let seed=m==='daily'?hash(today()+':'+app.sport+':daily'):m==='weekly'?hash(weekKey()+':'+app.sport+':weekly'):Math.floor(Math.random()*1e9);
 let d={sport:app.sport,mode:m,seed,round:0,slots:[...draftSlots()],picks:[],started:Date.now(),rollIndex:0,budget:app.sport==='nfl'?100:170,lockedTeam:null,categories:null,done:false,rerolls:{team:1,era:1,stat:1},boardSeed:'',current:null,nbaRole:app.nbaRole||'guard',nbaPool:app.nbaPool||'all'};
 if(m==='team')d.lockedTeam=PRO_TEAMS[app.sport][0];
 rollDraft(d);app.draft=d;setPage('draft');}
function rerollDraft(type){const d=app.draft;if(!d||d.done||!d.rerolls[type])return;d.rerolls[type]--;d.rollIndex++;
 const items=eligibleDraft(d);if(type==='team'){const teams=[...new Set(items.map(p=>p.team))].filter(t=>t!==d.team);if(teams.length)d.team=pick(teams,d.seed+':t:'+d.rollIndex);}
 if(type==='era'){const eras=[...new Set(items.filter(p=>p.team===d.team).map(p=>Math.floor(p.season/10)*10))].filter(e=>e!==d.era);if(eras.length)d.era=pick(eras,d.seed+':e:'+d.rollIndex)}
 if(type==='stat'&&d.sport==='nba'){let remaining=LEAGUES.nba.slots.filter(x=>!d.picks.some(p=>p.slot===x)&&x!==d.category);if(remaining.length){let next=pick(remaining,d.seed+':stat:'+d.rollIndex),old=d.categories[d.round],swap=d.categories.indexOf(next,d.round+1);if(swap>=0)d.categories[swap]=old;d.categories[d.round]=next;d.category=next;}}
 if(type==='stat'&&d.sport!=='nba'){notify('Position slots are fixed in this sport.');return;}
 persist();render();}
function changeAuction(budget){const d=app.draft;if(d&&!d.picks.length){d.budget=Number(budget);persist();render()}}
function changeTeamMode(team){const d=app.draft;if(!d||d.picks.length)return;d.lockedTeam=team;d.team=team;d.era=pick([...new Set(ALL[d.sport].filter(p=>p.team===team).map(p=>Math.floor(p.season/10)*10))],d.seed+':team')||2020;persist();render()}
function draftCandidates(d){const used=new Set(d.picks.map(x=>x.id));let src=eligibleDraft(d).filter(p=>!used.has(p.id));if(d.mode==='playoff'){let elite=src.filter(p=>p.rating>=90);if(elite.length>=4)src=elite;}const sameTeam=src.filter(p=>p.team===d.team&&Math.floor(p.season/10)*10===d.era);const teamElse=src.filter(p=>p.team===d.team&&!sameTeam.includes(p));const sameEra=src.filter(p=>Math.floor(p.season/10)*10===d.era&&!sameTeam.includes(p)&&!teamElse.includes(p));const rest=src.filter(p=>!sameTeam.includes(p)&&!teamElse.includes(p)&&!sameEra.includes(p));let list=[...shuffle(sameTeam,d.boardSeed+':a'),...shuffle(teamElse,d.boardSeed+':b'),...shuffle(sameEra,d.boardSeed+':c'),...shuffle(rest,d.boardSeed+':d')].slice(0,6);return list.map(p=>({...p,matched:p.team===d.team&&Math.floor(p.season/10)*10===d.era,teamMatch:p.team===d.team}))}
function pickDraft(id){const d=app.draft;if(!d||d.done)return;const p=draftCandidates(d).find(x=>x.id===id);if(!p)return;const cost=auctionCost(p,d);let budgetUsed=d.picks.reduce((sum,x)=>sum+x.cost,0),remaining=d.slots.length-d.picks.length-1;
 if(d.mode==='auction'&&budgetUsed+cost+remaining>d.budget){notify('Keep at least 1 credit for each remaining slot.');return;}
 let category=d.category;let value=gameRating(p,category);if(d.sport==='nfl')value=clamp(value+seeded('week-sim:'+p.id+':'+d.round,-16,18),18,99);
 d.picks.push({id:p.id,name:p.name,team:p.team,season:p.season,positions:p.pos,slot:category,value,rating:p.rating,cost,synthetic:!!p.synthetic,matched:p.matched});d.round++;
 if(d.round===d.slots.length){d.done=true;finishDraft(d);}else{d.rollIndex=0;rollDraft(d,'init')}
 persist();render();}
function draftScore(d){return Math.round(d.picks.reduce((sum,p)=>sum+p.value,0)/Math.max(1,d.picks.length)*10)/10}

function rosterFor(spId,year,franchise,player){let s=LEAGUES[spId],pool=ALL[spId].filter(p=>!p.synthetic),roles=spId==='nba'?['PG','SG','SF','PF','C','PG','SG','PF']:spId==='nfl'?['QB','RB','WR','WR','TE','LT','LG','C','RG','RT','WR','EDGE','LB','CB','FS']:spId==='soccer'?['GK','RB','CB','CB','LB','CM','CM','CAM','RW','ST','LW','ST','CM','CB']:['P','C','1B','2B','3B','SS','LF','CF','RF','DH','P','OF'];

 let winner=b.score1>=11&&b.score1-b.score2>=2?b.team1:b.score2>=11&&b.score2-b.score1>=2?b.team2:null;

}
function startBlacktop(){
 let p1=ALL.nba.find(p=>p.id===$('#blacktopP1')?.value)||ALL.nba[0],p2=ALL.nba.find(p=>p.id===$('#blacktopP2')?.value)||ALL.nba[1],format=clamp(Number($('#blacktopFormat')?.value)||1,1,3);
 if(p1.id===p2.id){notify('Choose two different players');return}
 const makeTeam=(star,other,seed)=>[star,...shuffle(ALL.nba.filter(p=>p.id!==star.id&&p.id!==other.id),seed).slice(0,format-1)];
 const team1=makeTeam(p1,p2,'blacktop:'+p1.id+':'+format),team2=makeTeam(p2,p1,'blacktop:'+p2.id+':'+format);
 app.blacktop={p1,p2,team1,team2,format,score1:0,score2:0,turn:0,log:[],started:true,finished:false};persist();render();
}
function blacktopPossession(){
 let b=app.blacktop;if(!b||b.finished)return;let home=b.turn%2===0,attack=home?b.team1:b.team2,defend=home?b.team2:b.team1;
 let a=attack.reduce((s,p)=>s+p.rating,0)/attack.length,d=defend.reduce((s,p)=>s+p.rating,0)/defend.length;
 let edge=(a-d)*.009,make=clamp(.48+edge,.24,.76),made=Math.random()<make,points=made?(Math.random()<.30?2:1):0;
 if(home)b.score1+=points;else b.score2+=points;
 let scorer=attack[rand(0,attack.length-1)],stopper=defend[rand(0,defend.length-1)];
 b.log.push(points?`${scorer.name} scores ${points===2?'a deep two':'a bucket'} for ${home?'your team':'the CPU'}.`:`${stopper.name} gets the stop on ${scorer.name}.`);b.log=b.log.slice(-40);b.turn++;
 if((b.score1>=11&&b.score1-b.score2>=2)||(b.score2>=11&&b.score2-b.score1>=2)||b.turn>=120)b.finished=true;
 persist();
}

 if(action==='restartSameMode'){newDraft(d.mode==='practice'?'blind':d.mode);return}
 if(action==='dailyCareer'){resetCareerSetup(app.sport);careerSetup.era=[1984,1992,2003,2016,2026][seeded(today()+app.sport,0,4)];careerSetup.team=PRO_TEAMS[app.sport][seeded(today()+app.sport+':team',0,PRO_TEAMS[app.sport].length-1)];careerSetup.name='Daily Prospect';showCareerCreator=true;app.page='career';render();notify('Daily scenario loaded');return}
 if(action==='createCareer'){careerSetup.name=$('#createName')?.value.trim()||careerSetup.name;careerSetup.customTeam=$('#createCustomTeam')?.value||careerSetup.customTeam||'';careerSetup.team=$('#createTeam')?.value||careerSetup.team;careerSetup.number=clamp(Number($('#createNumber')?.value)||9,0,99);careerSetup.era=Number($('#createEra')?.value)||2026;careerSetup.pos=$('#createPos')?.value||careerSetup.pos;showCareerCreator=false;createCareer();return}
 if(action==='newCareer'){newCareerConfirm();return}
 if(action==='replaceCareerNow'){if(app.careers)delete app.careers[app.sport];if(app.career?.sport===app.sport)app.career=null;closeModal();resetCareerSetup(app.sport);showCareerCreator=true;render();return}
 if(action==='nextSeason'){nextCareerSeason();return}
 if(action==='trainCareer'){trainCareer();return}
 if(action==='scoutProspects'){scoutDialog();return}
 if(action==='transferCareer'){transferDialog();return}
 if(action==='acceptTransfer'){let to=$('#transferTo')?.value;if(c&&to){c.team=to;c.roster=rosterFor(c.sport,c.year,c.team,c.player);c.history.unshift(`Transferred to ${to} for a new professional challenge.`);c.contract=3;persist();closeModal();render();notify('Transfer completed.')}return}
 if(action==='newCoach'){initCoach(false);return}
 if(action==='startCareerMatch'){if(!c){setPage('career');notify('Create a pro career first');return}initCoach(true);return}
 if(action==='coachPause'){coachPause();return}
 if(action==='coachStep'){coachStep();return}
 if(action==='coachFinish'){coachSimFinal();return}
 if(action==='coachTimeout'){coachTimeout();return}
 if(action==='callPlay'){if(coach){coach.nextPlay=$('#playSelect')?.value||coach.nextPlay;coachLog(`Coach calls ${coach.nextPlay} for the next play.`);persist();render();notify('Play called');}return}
 if(action==='drawRoute'){if(coach){coach.drawing=!coach.drawing;if(!coach.drawing&&coach.customPath.length<2)coach.customPath=[];render();}return}
 if(action==='applyTactic'){if(coach){coach.tactic=$('#tacticSelect')?.value||coach.tactic;coachLog(`Strategy changed to ${coach.tactic}.`);render();notify('Tactics applied');}return}
 if(action==='queueSub'){if(coach){if(!coach.bench.length)return;coach.pendingSub={out:Number($('#subOut')?.value),inIndex:Number($('#subIn')?.value)};coachLog('Substitution queued for the next stoppage.');render();notify('Sub queued');}return}
 if(action==='submitGrid'){gridGuess($('#gridInput')?.value||'');return}
 if(action==='gridHelp'){modal('<h2>Nine squares</h2><p>Choose a square. Enter the name of a player in our curated player-season database whose playing position matches the row and whose season/rating matches the column. Nine total guesses and no repeated names. Original puzzle design and local daily progress.</p><button class="btn green" id="cancelModal">GOT IT</button>');return}
 if(action==='editUsername'){profileTab='settings';render();return}
 if(action==='saveUsername'){app.username=($('#usernameInput')?.value||'Coach').trim().slice(0,25)||'Coach';saveAndRender();notify('Name saved');return}
 if(action==='addLeague'){let v=($('#leagueName')?.value||'').trim().slice(0,25);if(v&&!(app.localLeague||[]).includes(v)){app.localLeague=app.localLeague||[];app.localLeague.push(v);saveAndRender()}return}
 if(action==='submitLeagueScore'){let name=$('#leagueMember')?.value||app.username,score=Number($('#leagueScore')?.value);if(!Number.isFinite(score)||score<0||score>100){notify('Score must be from 0 to 100');return}app.leagueScores=app.leagueScores||[];app.leagueScores.push({name,score,date:today()});app.leagueScores=app.leagueScores.slice(-100);saveAndRender();return}
 if(action==='exportSave'){const blob=new Blob([JSON.stringify({...app,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='era-rivals-pro-lab-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Save exported');return}
 if(action==='resetStorage'){modal('<h2>Reset local ERA RIVALS progress?</h2><p>This removes saved careers, drafts, badges, and local records from this browser. Export a backup first if you want to keep them.</p><div class="action-row"><button class="btn primary" id="resetConfirmed">DELETE LOCAL PROGRESS</button><button class="btn" id="cancelModal">CANCEL</button></div>');return}
 if(action==='resetConfirmed'){app=baseSave();coach=null;closeModal();persist();render();notify('Local progress reset');return}
}
document.addEventListener('click',e=>{
 const button=e.target.closest('button,a');if(!button)return;
 if(button.dataset.blacktopAction==='reset'){app.blacktop=null;persist();render();return}
 if(button.dataset.nbaRole){app.nbaRole=button.dataset.nbaRole;persist();render();return}
 if(button.dataset.nbaDraft){app.nbaPool=button.dataset.pool||'all';app.nbaRole=button.dataset.role||app.nbaRole||'guard';newDraft(button.dataset.nbaDraft);return}
 if(button.dataset.squadPool){app.squadBuilder=app.squadBuilder||{picks:[],pool:'all'};if(!app.squadBuilder.picks.length)app.squadBuilder.pool=button.dataset.squadPool;persist();render();return}
 if(button.dataset.squadPick){let b=app.squadBuilder||(app.squadBuilder={picks:[],pool:'all'}),pos=NBA_POSITIONS[b.picks.length],p=ALL.nba.find(x=>x.id===button.dataset.squadPick);if(pos&&p&&!b.picks.some(x=>x.id===p.id)&&(p.pos||[]).includes(pos)){b.picks.push({...p});persist();render()}return}
 if(button.hasAttribute('data-squad-save')){saveSquad();return}
 if(button.hasAttribute('data-squad-reset')){app.squadBuilder={picks:[],pool:'all'};persist();render();return}
 if(button.dataset.capPool){app.capBuilder=app.capBuilder||{picks:[],budget:150,pool:'all'};if(!app.capBuilder.picks.length)app.capBuilder.pool=button.dataset.capPool;persist();render();return}
 if(button.dataset.capBudget){app.capBuilder=app.capBuilder||{picks:[],budget:150,pool:'all'};if(!app.capBuilder.picks.length)app.capBuilder.budget=Number(button.dataset.capBudget);persist();render();return}
 if(button.dataset.capPick){let b=app.capBuilder||(app.capBuilder={picks:[],budget:150,pool:'all'}),pos=NBA_POSITIONS[b.picks.length],p=ALL.nba.find(x=>x.id===button.dataset.capPick);if(pos&&p&&!b.picks.some(x=>x.id===p.id)&&(p.pos||[]).includes(pos)){let salary=nbaSalary(p),spent=b.picks.reduce((a,x)=>a+x.salary,0);if(spent+salary<=b.budget){b.picks.push({...p,salary});persist();render()}else notify('That player would put you over the cap.')}return}
 if(button.hasAttribute('data-cap-save')){saveCapRoster();return}
 if(button.hasAttribute('data-cap-reset')){app.capBuilder={picks:[],budget:150,pool:'all'};persist();render();return}

 if(button.dataset.sport){selectSport(button.dataset.sport);return}
 if(button.dataset.page){setPage(button.dataset.page);return}
 if(button.dataset.mode){newDraft(button.dataset.mode);return}
 if(button.dataset.pick){pickDraft(button.dataset.pick);return}
 if(button.dataset.reroll){rerollDraft(button.dataset.reroll);return}
 if(button.dataset.budget){changeAuction(button.dataset.budget);return}
 if(button.dataset.track){careerSetup.track=button.dataset.track;render();return}
 if(button.dataset.coachTab){coachTab=button.dataset.coachTab;render();return}
 if(button.dataset.speed){if(coach){coach.speed=Number(button.dataset.speed);render();}return}
 if(button.dataset.simGames){simCareerGames(Number(button.dataset.simGames));return}
 if(button.dataset.gridCell){gridSelected=Number(button.dataset.gridCell);render();return}
 if(button.dataset.profileTab){profileTab=button.dataset.profileTab;render();return}
 if(button.dataset.sign){signProspect(button.dataset.sign);return}
 if(button.dataset.removeLeague){app.localLeague.splice(Number(button.dataset.removeLeague),1);saveAndRender();return}
 if(button.dataset.pastDay){startPastDaily(button.dataset.pastDay);return}
 if(button.id){applyDecision(button.id,e);}
});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='teamLock'){changeTeamMode(t.value);return}if(t.id==='createPos'){careerSetup.pos=t.value;careerSetup.height=WIDTHS[app.sport]?.[t.value]||careerSetup.height;render();return}if(t.id==='createEra'){careerSetup.era=Number(t.value);return}if(t.id==='createTeam'){careerSetup.team=t.value;return}if(t.id==='createName'){careerSetup.name=t.value;return}if(t.id==='createCustomTeam'){careerSetup.customTeam=t.value;return}if(t.id==='createNumber'){careerSetup.number=Number(t.value);return}if(t.id==='createHeight'){careerSetup.height=Number(t.value);render();return}if(t.id==='createWeight'){careerSetup.weight=Number(t.value);render();return}if(t.dataset.creatorSkill){changeCareerSkill(t.dataset.creatorSkill,t.value);return}
 if(t.id==='importSave'){let file=t.files?.[0];if(file)file.text().then(txt=>{let v=JSON.parse(txt);if(!v||typeof v!=='object'||!LEAGUES[v.sport])throw Error('Invalid save');app={...baseSave(),...v,page:'home'};coach=null;persist();render();notify('Backup imported')}).catch(()=>notify('Could not import save'));return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='gridInput'){e.preventDefault();gridGuess($('#gridInput')?.value||'')}});
document.addEventListener('click',e=>{const canvas=e.target.closest('#simCanvas');if(!canvas||!coach)return;const r=canvas.getBoundingClientRect(),x=clamp((e.clientX-r.left)/r.width,0,1),y=clamp((e.clientY-r.top)/r.height,0,1);if(coach.drawing){coach.customPath.push([x,y]);if(coach.customPath.length>8)coach.customPath.shift();notify('Route point added');drawCoachCanvas(performance.now()/1000);return;}let p=[...coach.homeActors,...coach.awayActors].map(z=>({...z,dist:Math.hypot(z.x-x,z.y-y)})).sort((a,b)=>a.dist-b.dist)[0];if(p&&p.dist<.10)notify(`${p.name} · ${p.pos} · ${p.rating} OVR · ${Math.round(p.energy)}% energy`);});
// Initialize: restore only ordinary state; an unfinished coach match is deliberately not persisted.
if(!window._ER_RIVALS_ACTIVE){window._ER_RIVALS_ACTIVE=true;render();coachRAF=requestAnimationFrame(animateCoach);}

</script>
