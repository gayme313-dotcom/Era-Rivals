/* Enhanced flagship visuals */
.flagship-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:18px}
.flagship-card{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));box-shadow:0 16px 48px rgba(0,0,0,.28)}
.flagship-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(158,255,0,.12),transparent 34%),radial-gradient(circle at bottom left,rgba(77,151,255,.12),transparent 30%);pointer-events:none}
.flagship-hero{padding:18px 18px 0 18px}
.flagship-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.flagship-badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.flagship-badge .emoji{font-size:17px}
.flagship-series{font-size:12px;color:var(--muted)}
.flagship-title{font-size:28px;line-height:1;letter-spacing:-.04em;margin:8px 0 6px 0}
.flagship-sub{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 14px 0}
.sport-preview{height:245px;border-radius:20px;border:1px solid rgba(255,255,255,.08);overflow:hidden;position:relative;background:#0a1220;display:flex;align-items:center;justify-content:center}
.sport-preview svg{width:100%;height:100%;display:block}
.sport-overlay{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.sport-stat{background:rgba(9,14,25,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);padding:9px 10px;border-radius:14px;min-width:92px}
.sport-stat b{display:block;font-size:15px}
.sport-stat span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.feature-chips,.mini-chips{display:flex;flex-wrap:wrap;gap:8px}
.feature-chip,.mini-chip{border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:12px}
.flagship-body{padding:16px 18px 18px 18px}
.flagship-list{display:grid;gap:10px;margin:14px 0 16px 0}
.flagship-list div{display:flex;gap:10px;align-items:flex-start;color:#ecf3ff;font-size:14px}
.flagship-list span:first-child{font-size:16px;line-height:1.1}
.flagship-actions{display:flex;gap:10px;flex-wrap:wrap}
.flagship-actions .btn{flex:1 1 145px}
@media (max-width:720px){
  .flagship-title{font-size:24px}
  .sport-preview{height:215px}
}


/* Xavier Matos signature: original studio identity */
.creator-inline{color:#fff;background:#293e33;border:1px solid #668059;padding:4px 7px;border-radius:6px;margin-left:3px}
.creator-signature{display:flex;align-items:center;gap:12px;margin-top:24px;position:relative;max-width:430px;padding:12px 15px;border:1px solid #5e7b5b7c;background:#0e1c22b8;border-radius:14px;backdrop-filter:blur(14px)}
.creator-signature strong{display:block;font-size:12px;letter-spacing:.16em;color:#e4ffa5}.creator-signature small{display:block;font-size:11px;color:#a2bbba;margin-top:3px}
.creator-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#d3fa75,#7ebf93);color:#13241c;font-size:14px;font-weight:1000;flex:none;box-shadow:0 3px 20px #bffb7533}
.footer strong{color:#d3fa75;letter-spacing:.1em}
/* studio motion */
.page{animation:pageIn .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.btn,.choice,.candidate,.flagship-card,.scout-pick,.game-card{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s,background .2s}
.flagship-card:hover{transform:translateY(-5px);border-color:#d3fa7566;box-shadow:0 25px 60px #0008}
.flagship-card:hover .sport-preview svg{transform:scale(1.035)}
.sport-preview svg{transition:transform .55s cubic-bezier(.2,.75,.2,1)}
.btn:active:not(:disabled),.candidate:active:not(:disabled),.scout-pick:active{transform:scale(.98)}
.candidate:hover:not(:disabled){transform:translateX(3px);box-shadow:0 10px 24px #0005}
/* organized draft controls and scouting */
.draft-progress{display:flex;gap:4px;margin:12px 0 16px;overflow:hidden}
.step-chip{flex:1;min-width:16px;text-align:center;padding:10px 1px;background:#1c2939;border:1px solid #304255;border-radius:7px;color:#8198a9;font-size:10px;font-weight:850}
.step-chip.done{border-color:#679b7490;background:#214038;color:#bfffa7}.step-chip.now{border-color:#d3fa75;background:#d3fa75;color:#111a12;box-shadow:0 0 16px #d3fa7544}
.scout-heading{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}
.scout-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:9px 0 16px}
.scout-pick{text-align:left;border:1px solid #395568;border-radius:13px;padding:11px 10px;background:linear-gradient(145deg,#243947,#1c2c3c);min-width:0;color:#eff7ff;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.scout-pick:first-child{border-color:#a4d66d66;background:linear-gradient(145deg,#30452f,#1c2c30)}
.scout-pick:hover{transform:translateY(-2px);border-color:#d3fa75;box-shadow:0 10px 20px #0005}
.scout-pick>span{font-size:9px;font-weight:950;color:#bce18e;letter-spacing:.1em}
.scout-pick strong{font-size:12px;line-height:1.28;overflow-wrap:anywhere}
.scout-pick small{font-size:10px;line-height:1.3;color:#a6c0ca}
.scout-pick b{font-size:9px;letter-spacing:.08em;color:#d3fa75;margin-top:auto}
.scout-controls{display:flex;gap:11px;margin:0 0 13px;flex-wrap:wrap}
.scout-controls label{color:#a4b6c7;font-size:11px;font-weight:800;flex:1;min-width:130px}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function choose(a){return a[rand(0,a.length-1)]}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=rand(0,i);[b[i],b[j]]=[b[j],b[i]]}return b}
function initials(s){return String(s).split(/\s+/).map(x=>x[0]).filter(Boolean).slice(-2).join('').toUpperCase()}
function toast(msg){let old=$('toast');if(old)old.remove();let d=document.createElement('div');d.className='toast';d.id='toast';d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),2800)}

function renderSetup(){const s=SPORT[setup.sport];if(!s){go('home');return}root.innerHTML=`<div class="button-row"><button class="btn ghost" onclick="go('sports')">← Games</button><span class="tag">${s.label}</span></div><div class="heading"><div><div class="eyebrow">ERA RIVALS · A XAVIER MATOS ORIGINAL</div><h2>${s.emoji} ${s.name}</h2><p>Set the rules. Then start building your all-time team.</p></div></div><div class="two-col"><section class="panel"><h3>01 · Draft format</h3><div class="choice-grid">${MODES.map(m=>`<button class="choice ${setup.mode===m.id?'active':''}" onclick="setSetup('mode','${m.id}')"><strong>${m.icon} ${m.name}</strong><small>${m.desc}</small></button>`).join('')}</div><div class="accent-line"></div><h3>02 · Your rivalry</h3><div class="choice-grid"><button class="choice ${setup.players==='two'?'active':''}" onclick="setSetup('players','two')"><strong>👥 Two players</strong><small>Pass-and-play, same device</small></button><button class="choice ${setup.players==='solo'?'active':''}" onclick="setSetup('players','solo')"><strong>🤖 Solo vs AI</strong><small>Adaptive computer rival</small></button></div><div class="form-grid" style="margin-top:15px"><label class="field">Player one<input id="nameA" maxlength="24" value="${esc(setup.nameA)}" onchange="setup.nameA=this.value"></label><label class="field">${setup.players==='solo'?'AI opponent':'Player two'}<input id="nameB" maxlength="24" value="${esc(setup.nameB)}" onchange="setup.nameB=this.value" ${setup.players==='solo'?'readonly':''}></label></div></section><div><section class="panel"><h3>03 · Lineup settings</h3><div class="form-grid">${[0,1].map((t)=>`<label class="field">${t===0?'Player one':'Player two'} formation<select onchange="setSetup('${t?'formB':'formA'}',this.value)">${Object.keys(s.forms).map(f=>`<option value="${esc(f)}" ${setup[t?'formB':'formA']===f?'selected':''}>${esc(f)}</option>`).join('')}</select></label>`).join('')}</div><p class="small">First pick alternates by position. Both teams fill the same number of spots. A drafted player cannot appear on both teams.</p><p class="small">${setup.mode==='salary'?`Salary cap: ${capFor(setup.sport,setup.formA)}–${capFor(setup.sport,setup.formB)} fantasy credits (based on selected formation). Prices are fictional game values.`:setup.mode==='era'?'Era Spin: two rerolls per team. The wheel picks from eligible historic team/decade combinations.':'Match simulations use position-aware game ratings and tactics.'}</p><div class="stats-strip" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><strong>${s.forms[setup.formA].length}</strong><span>Roster positions</span></div><div class="stat"><strong>${setup.series}</strong><span>Maximum games</span></div></div><button class="btn primary" style="width:100%" onclick="startGame()">START YOUR DRAFT →</button></section><section class="panel"><h3>How it works</h3><p class="small">1. Take turns selecting one eligible player for each position.<br>2. Compare complete squads and choose tactics.<br>3. Watch a simulated match and review the box score.<br>4. Make at most one player change each before the next match.<br>5. Win the best-of-${setup.series} series.</p></section></div></div>`}
function startGame(){const s=SPORT[setup.sport];const cfg={...setup,nameA:($('nameA')?.value||setup.nameA||'YOU').trim().slice(0,24)||'YOU',nameB:($('nameB')?.value||setup.nameB||'RIVAL').trim().slice(0,24)||'RIVAL'};if(cfg.players==='solo')cfg.nameB='THE AI';setup=cfg;try{localStorage.setItem(PREFS_KEY,JSON.stringify({mode:cfg.mode,players:cfg.players,nameA:cfg.nameA,nameB:cfg.players==='solo'?'RIVAL':cfg.nameB}))}catch(e){}
 game={version:1,sport:cfg.sport,mode:cfg.mode,players:cfg.players,phase:'draft',created:Date.now(),round:0,step:0,offer:null,rerolls:[2,2],wins:[0,0],games:[],series:cfg.series,subTurn:0,swapSlot:null,teams:[{name:cfg.nameA,formation:cfg.formA,lineup:[],tactic:'Balanced',budget:capFor(cfg.sport,cfg.formA)},{name:cfg.nameB,formation:cfg.formB,lineup:[],tactic:'Balanced',budget:capFor(cfg.sport,cfg.formB)}]};persist();go('game')}
let scoutSort='rating', scoutView='all';
let watchSpeed=1,watchPaused=false;
function resetWatchControls(){watchPaused=false;watchSpeed=1}
function setScoutSort(v){if(!['rating','value','price','era'].includes(v))return;scoutSort=v;filterCandidates()}
function setScoutView(v){if(!['all','top','budget'].includes(v))return;scoutView=v;filterCandidates()}
function scoutingScore(p){
 const raw=p.rating,price=signedCost(p);
 if(game.mode==='salary')return raw/Math.pow(Math.max(price,1),.42);
 return raw;
}
function sortedScouts(arr){
 if(scoutSort==='rating')return arr.sort((a,b)=>b.rating-a.rating||a.name.localeCompare(b.name));
 if(scoutSort==='value')return arr.sort((a,b)=>scoutingScore(b)-scoutingScore(a)||b.rating-a.rating);
 if(scoutSort==='price')return arr.sort((a,b)=>signedCost(a)-signedCost(b)||b.rating-a.rating);
 return arr.sort((a,b)=>b.season-a.season||b.rating-a.rating);
}
function scoutCandidates(search=''){
 const result=draftCandidates(search);
 const {team,slot}=activePosition();
 let candidates=result;
 if(scoutView==='budget'&&game.mode==='salary'){
   const t=game.teams[team],left=t.budget-totalCost(t),remaining=rosterSlots(team).length-slot;
   candidates=candidates.filter(p=>signedCost(p)<=Math.ceil(left/Math.max(1,remaining)*1.4));
 }
 if(scoutView==='top')candidates=candidates.slice().sort((a,b)=>scoutingScore(b)-scoutingScore(a)).slice(0,12);
 return sortedScouts(candidates);
}
function scoutReason(p){
 const {team,slot}=activePosition();
 if(game.mode==='salary'){
  const cap=game.teams[team].budget;
  const left=cap-totalCost(game.teams[team])-signedCost(p);
  return 'OVR '+p.rating+' · '+signedCost(p)+' credits · '+left+' left'+(p.emergency?' · minimum contract':'');
 }
 return p.rating+' overall · '+p.team+' '+p.season;
}
function featuredScouts(){
 if(game.mode==='era'&&!game.offer)return '';
 const candidates=draftCandidates();
 if(!candidates.length)return '';
 const best=candidates.slice().sort((a,b)=>b.rating-a.rating)[0];
 const value=candidates.slice().sort((a,b)=>scoutingScore(b)-scoutingScore(a))[0];
 const budget=candidates.slice().sort((a,b)=>signedCost(a)-signedCost(b)||b.rating-a.rating)[0];
 const alternative=candidates.filter(p=>p.id!==best.id).sort((a,b)=>b.rating-a.rating)[0]||best;
 const laterEra=candidates.filter(p=>p.id!==best.id&&p.id!==alternative.id).find(p=>p.season!==best.season)||candidates.find(p=>p.id!==best.id&&p.id!==alternative.id)||best;
 const distinctValue=value.id===best.id?alternative:value;
 const distinctBudget=budget.id===best.id||budget.id===distinctValue.id?(candidates.filter(p=>p.id!==best.id&&p.id!==distinctValue.id).sort((a,b)=>signedCost(a)-signedCost(b))[0]||budget):budget;
 const picks=game.mode==='salary'?[['TOP TALENT',best],['BEST VALUE',distinctValue],['LOW COST',distinctBudget]]:[['TOP RATED',best],['RUNNER UP',alternative],['DIFFERENT ERA',laterEra]];
 return `<div class="scout-grid">${picks.map(([label,p])=>`<button class="scout-pick" onclick="draftPick('${p.id}')" title="Draft ${esc(p.name)}"><span>${label}</span><strong>${esc(p.name)}</strong><small>${esc(scoutReason(p))}</small><b>SELECT ↗</b></button>`).join('')}</div>`;
}
function draftProgress(){
 const num=rosterSlots(0).length;
 return `<div class="draft-progress" aria-label="Draft position progress">${Array.from({length:num},(_,i)=>`<div class="step-chip ${i<Math.floor(game.step/2)?'done':i===Math.floor(game.step/2)?'now':''}" title="Round ${i+1}: ${rosterSlots(0)[i]} / ${rosterSlots(1)[i]}">${i+1}</div>`).join('')}</div>`;
}
function draftTacticsPreview(){
 const {team,pos}=activePosition();
 return `<div class="scout-advice"><strong>🎯 LIVE SCOUT REPORT</strong><p>${game.mode==='salary'?`You have <strong>${game.teams[team].budget-totalCost(game.teams[team])}</strong> credits left. Every new pick is checked against your remaining positions.`:game.mode==='era'?'Spin gives a historical franchise and decade. Only players who actually fit this position can be drafted.':game.mode==='blind'?'You can see athlete names and seasons, but overalls stay hidden until the roster is complete.':'You can pick across eras, but a player cannot appear on both teams.'}</p><div class="preview-stats"><span>🔵 ${game.teams[0].lineup.length}/${rosterSlots(0).length} picked</span><span>🔴 ${game.teams[1].lineup.length}/${rosterSlots(1).length} picked</span></div></div>`;
}
function draftFieldPreview(){
 if(game.sport==='nfl')return '';
 return `<details class="draft-field-panel"><summary>🗺️ View live lineup on the field <span>▾</span></summary><div class="live-formation-grid">${game.teams.map((t,i)=>{
   const slots=rosterSlots(i), coords=pitchCoords(t.formation,game.sport);
   return `<div class="live-formation"><h4>${esc(t.name)} · ${esc(t.formation)}</h4><div class="field-mini ${game.sport==='nba'?'basket-mini':''}">${slots.map((role,n)=>`<div class="field-mini-player ${t.lineup[n]?'filled':'open'}" style="left:${coords[n][0]}%;top:${coords[n][1]}%"><b>${esc(role)}</b><span>${t.lineup[n]?esc(t.lineup[n].name.split(' ').slice(-1)[0]):'OPEN'}</span></div>`).join('')}</div></div>`}).join('')}</div></details>`;
}
function setWatchSpeed(){watchSpeed=watchSpeed===1?2:watchSpeed===2?4:1;if(game?.phase==='watch'&&!watchPaused&&watchTimer)watchMoments();else if(game?.phase==='watch')renderMatch()}
function toggleWatch(){if(!game||game.phase!=='watch')return;if(watchTimer){clearInterval(watchTimer);watchTimer=null;watchPaused=true;renderMatch();return}watchPaused=false;watchMoments()}
function playByPlayClock(){if(!game?.match)return 0;const e=game.match.events.slice(0,game.watchIndex);return e.length?e[e.length-1].at:0}
function tacticsMatchup(){
 if(!game)return {edge:0,message:''};
 const sport=game.sport,a=game.teams[0].tactic,b=game.teams[1].tactic;
 // Matchup advantages are intentional game design, not real-world claims.
 const cycles={soccer:[['High Press','Possession'],['Counterattack','High Press'],['Possession','Counterattack']],nba:[['Fast Break','Inside Game'],['Inside Game','Perimeter'],['Perimeter','Fast Break']],nfl:[['Air Raid','Ground Game'],['Ground Game','Blitz'],['Blitz','Air Raid']]};
 const beats=cycles[sport]||[];
 const edge=beats.some(x=>x[0]===a&&x[1]===b)?2:beats.some(x=>x[0]===b&&x[1]===a)?-2:0;
 return{edge,message:edge>0?'🔵 Blue has a tactical edge':edge<0?'🔴 Red has a tactical edge':'⚖️ Tactics are evenly matched',details:'Style matchups are fantasy simulation rules. Stronger players can still lose, and upsets are possible.'};
}
function updateTacticsScout(){const el=$('tacticsScout');if(el){const m=tacticsMatchup();el.innerHTML='<strong>'+esc(m.message)+'</strong><p>'+esc(m.details)+'</p>'}}
function gameMVP(){const m=game?.match;if(!m||!m.playerStats)return null;const t=m.winner,arr=m.playerStats[t]||[];
 if(m.sport==='soccer'){const sorted=arr.slice().sort((a,b)=>(b.G*5+b.A*3+b.S*.1)-(a.G*5+a.A*3+a.S*.1));return sorted[0]?{name:sorted[0].player,line:`${sorted[0].G} G · ${sorted[0].A} A · ${sorted[0].S} shots`}:null}
 if(m.sport==='nba'){const sorted=arr.slice().sort((a,b)=>(b.PTS+b.REB*.6+b.AST*.9)-(a.PTS+a.REB*.6+a.AST*.9));return sorted[0]?{name:sorted[0].player,line:`${sorted[0].PTS} PTS · ${sorted[0].REB} REB · ${sorted[0].AST} AST`}:null}
 return arr[0]?{name:arr[0].player,line:arr[0].STAT}:null;
}
function currentTurn(){const round=Math.floor(game.step/2);return (game.step%2===0)?round%2:1-round%2}
function rosterSlots(i){return SPORT[game.sport].forms[game.teams[i].formation]}
function activePosition(){const i=currentTurn(),j=Math.floor(game.step/2);return{team:i,slot:j,pos:rosterSlots(i)[j]}}
function athleteUsed(exceptTeam=-1,exceptSlot=-1){const names=new Set();game.teams.forEach((t,i)=>t.lineup.forEach((p,j)=>{if(i===exceptTeam&&j===exceptSlot)return;if(p)names.add(p.name)}));return names}
function playerAt(id){return DATA[game.sport].find(p=>p.id===id)}
function signedCost(p){return Number.isFinite(p?.signedPrice)?p.signedPrice:moneyPrice(p)}
function totalCost(t){return t.lineup.reduce((s,p)=>s+(p?signedCost(p):0),0)}
function rosterRemaining(played,slotIndex,candidate){const slots=rosterSlots(played),used=athleteUsed();if(candidate)used.add(candidate.name);let need=0;for(let j=slotIndex+1;j<slots.length;j++){const choices=DATA[game.sport].filter(p=>p.positions.includes(slots[j])&&!used.has(p.name));if(!choices.length)return Infinity;need+=Math.min(...choices.map(moneyPrice))}return need}
function validBuy(player,teamIndex,slotIndex){if(game.mode!=='salary')return true;const t=game.teams[teamIndex];return totalCost(t)+moneyPrice(player)+rosterRemaining(teamIndex,slotIndex,player)<=t.budget}
function eligible(pos,teamIndex,slotIndex){
 const used=athleteUsed(),pool=DATA[game.sport].filter(p=>p.positions.includes(pos)&&!used.has(p.name));
 if(game.mode!=='salary')return pool;
 const affordable=pool.filter(p=>validBuy(p,teamIndex,slotIndex));
 if(affordable.length)return affordable;
 if(!pool.length)return [];
 // Protect the match from an impossible roster: low-rated players are available on
 // one-position-only minimum contracts. No team can exceed its actual cap.
 // This is intentionally a clearly labeled fantasy balancing mechanic, not a real salary.
 const t=game.teams[teamIndex],slotsLeft=rosterSlots(teamIndex).length-slotIndex-1;
 const room=Math.max(0,t.budget-totalCost(t));
 const offer=Math.max(0,Math.min(7,room-Math.min(room,slotsLeft)));
 return pool.slice().sort((a,b)=>a.rating-b.rating||moneyPrice(a)-moneyPrice(b)).slice(0,6).map(p=>({...p,signedPrice:offer,emergency:true}));
}
function spinOffer(auto=false){if(!game||game.phase!=='draft'||game.mode!=='era')return;const {team,slot,pos}=activePosition();if(game.players==='solo'&&team===1&&!auto)return;const choices=eligible(pos,team,slot);if(!choices.length){toast('No eligible players remain. Restart with another formation.');return}
 const groups=new Map();for(const p of choices){const decade=Math.floor(p.season/10)*10;const key=p.team+'__'+decade;if(!groups.has(key))groups.set(key,{team:p.team,decade,players:[]});groups.get(key).players.push(p)}
 let opts=[...groups.values()];if(game.offer&&opts.length>1)opts=opts.filter(x=>x.team!==game.offer.team||x.decade!==game.offer.decade);const chosen=choose(opts.length?opts:[...groups.values()]);game.offer={team:chosen.team,decade:chosen.decade,ids:chosen.players.map(p=>p.id),slot,owner:team};persist();renderDraft();if(game.players==='solo'&&team===1)scheduleAI()}
function reroll(){if(game.mode!=='era'||!game.offer)return;const {team}=activePosition();if(game.rerolls[team]<1)return toast('No rerolls left.');game.rerolls[team]--;game.offer=null;spinOffer()}
function draftCandidates(search=''){if(!game||game.phase!=='draft')return[];const {team,slot,pos}=activePosition();let pool=eligible(pos,team,slot);if(game.mode==='era'){const ids=new Set(game.offer?.ids||[]);pool=pool.filter(p=>ids.has(p.id))}if(search)pool=pool.filter(p=>(p.name+' '+p.team+' '+p.season).toLowerCase().includes(search.toLowerCase()));return pool.sort((a,b)=>b.rating-a.rating||a.name.localeCompare(b.name))}
function chosenCard(p,opts={}){const blind=opts.blind,showCost=opts.showCost;return `<div class="candidate-wrap"><button class="candidate" onclick="${opts.action||`draftPick('${p.id}')`}" ${opts.disabled?'disabled':''}><span class="avatar jersey-avatar"><i>${esc(p.positions[0])}</i><b>${initials(p.name)}</b></span><span class="candidate-profile"><strong>${esc(p.name)}</strong><small>${esc(p.team)} · ${p.season} · ${esc(p.positions.join(' / '))}</small>${p.emergency?'<small style="color:#f8d49b;font-weight:850">🛟 MINIMUM CONTRACT · CAP PROTECTION</small>':''}${p.stats&&!blind?`<small style="color:#badfb4">${esc(p.stats)} · verified snapshot</small>`:''}</span><span class="rating">${blind?'?':showCost?signedCost(p)+' ◈':p.rating}<small>${blind?'HIDDEN':showCost?'PRICE':'OVR'}</small></span></button><button class="btn tiny ghost info-btn" title="Player info and historic stats" onclick="playerInfo('${p.id}')" aria-label="Player info for ${esc(p.name)}">ⓘ</button></div>`}
function playerInfo(id){const p=playerAt(id);if(!p)return;const blind=game?.phase==='draft'&&game.mode==='blind';const div=document.createElement('div');div.id='player-modal';div.className='modal-backdrop';div.onclick=e=>{if(e.target===div)div.remove()};div.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Player profile"><div class="eyebrow">PLAYER PROFILE · ${esc(game.sport.toUpperCase())}</div><h2 style="margin:8px 0;font-size:29px">${esc(p.name)}</h2><p class="muted">${esc(p.team)} · ${p.season} · ${esc(p.positions.join(' / '))}</p><div class="stats-strip" style="grid-template-columns:1fr 1fr"><div class="stat"><strong>${blind?'?':p.rating}</strong><span>Editorial game overall</span></div><div class="stat"><strong>${blind?'?':moneyPrice(p)}</strong><span>Fantasy credits</span></div></div><div class="callout">${p.stats?`<strong>Verified season snapshot</strong><br>${esc(p.stats)}`:'<strong>Historical stats not yet loaded</strong><br>No verified season stat snapshot is stored for this player in the offline edition.'}</div>${p.source?`<p class="small"><a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">Read the historical statistics source ↗</a></p>`:''}<p class="footnote">Player game ratings are fictional estimates for entertainment. The real historical season and team are separate from the fantasy simulation.</p><button class="btn primary" onclick="document.getElementById('player-modal').remove()">CLOSE</button></div>`;document.body.append(div)}
function rosterRow(p,position,index,t,interactive=false){return `<div class="seat ${game?.phase==='intermission'&&game.swapSlot===index?'is-active':''}" ${interactive?`onclick="selectSwap(${index})" role="button" tabindex="0" style="cursor:pointer"`:''}><span class="pos">${position}</span><span style="min-width:0;flex:1"><span class="player-name">${p?esc(p.name):'<span class="muted">Open slot</span>'}</span><div class="player-note">${p?esc(p.team)+' · '+p.season:''}</div></span>${p?`<span class="tag" style="white-space:nowrap">${game?.mode==='blind'&&game?.phase==='draft'?'? OVR':game?.mode==='salary'?signedCost(p)+' ◈':p.rating+' OVR'}</span>`:''}</div>`}
function rosterPanel(t,active){const team=game.teams[t],slots=rosterSlots(t);return `<div class="board"><div class="split-title"><div><div class="team-chip ${t?'red':'blue'}">${t?'● PLAYER TWO':'● PLAYER ONE'}</div><h3 style="margin:3px 0 1px">${esc(team.name)}</h3><div class="muted small">${esc(team.formation)} · ${team.lineup.length}/${slots.length} drafted</div></div><span class="tag">${game.mode==='salary'?(team.budget-totalCost(team))+' ◈ LEFT':team.tactic.toUpperCase()}</span></div>${game.mode==='salary'?`<div class="budget-meter"><div style="width:${clamp(totalCost(team)/team.budget*100,0,100)}%"></div></div>`:''}<div class="roster-list" style="margin-top:12px">${slots.map((pos,i)=>rosterRow(team.lineup[i],pos,i,t,active)).join('')}</div></div>`}
function renderGame(){if(!game){go('home');return}route='game';window.scrollTo({top:0});const s=SPORT[game.sport];const back=`<div class="button-row" style="margin-bottom:17px"><button class="btn ghost" onclick="confirmLeave()">← Main menu</button><span class="tag">${esc(s.name.toUpperCase())}</span><span class="tag">${esc(modeById(game.mode).name.toUpperCase())}</span><span class="tag">${esc(game.players==='solo'?'SOLO VS AI':'TWO PLAYERS')}</span></div>`;if(game.phase==='draft')renderDraft(back);else if(game.phase==='preMatch')renderPreMatch(back);else if(game.phase==='watch'||game.phase==='postMatch')renderMatch(back);else if(game.phase==='intermission')renderIntermission(back);else if(game.phase==='seriesEnd')renderSeriesEnd(back)}

function renderDraft(back=''){const {team,slot,pos}=activePosition();const t=game.teams[team],isAI=game.players==='solo'&&team===1,players=draftCandidates();const hidden=game.mode==='blind',era=game.mode==='era';root.innerHTML=`${back}<div class="heading"><div><div class="eyebrow">DRAFT ROOM · ROUND ${slot+1} / ${rosterSlots(team).length}</div><h2>${esc(t.name)} <span class="accent">ON THE CLOCK</span></h2><p>Drafting <strong>${pos}</strong>. ${slot%2===0?'Player one picks first this round.':'Player two picks first this round.'} ${game.step%2===1?'Second selection.':'First selection.'}</p></div><span class="tag">PICK ${game.step+1} OF ${rosterSlots(0).length*2}</span></div>${draftProgress()}<div class="side-panel"><div><div class="panel"><div class="split-title"><div><div class="eyebrow">NOW SELECTING</div><h2 style="font-size:30px;margin:3px 0">${pos} · ${esc(t.name)}</h2></div><div style="font-size:36px">${SPORT[game.sport].emoji}</div></div>${era?`<div style="text-align:center">${game.offer?`<div class="spin-disc">🎡</div><div class="eyebrow">SPIN RESULT</div><h3>${esc(game.offer.team)} · ${game.offer.decade}s</h3><p class="small">Showing actual players from this franchise and decade who can play ${pos}.</p>`:`<div class="spin-disc ${isAI?'spinning':''}">🎡</div><h3>Spin your team + decade</h3><p class="small">The wheel only chooses a team/era combination with eligible players for this position.</p>`}<div class="button-row" style="justify-content:center;margin:14px 0">${!game.offer?`<button class="btn primary" onclick="spinOffer()" ${isAI?'disabled':''}>🎰 SPIN THE WHEEL</button>`:`<button class="btn ghost" onclick="reroll()" ${isAI||!game.rerolls[team]?'disabled':''}>↻ Reroll (${game.rerolls[team]} left)</button>`}</div></div>`:`<div class="callout small">${hidden?'Player ratings are hidden until the full draft is complete. Names and historical teams are visible.':game.mode==='salary'?'The displayed prices are fictional fantasy credits, not real salaries. You must function draftPick(id,auto=false){if(!game||game.phase!=='draft')return false;const {team,slot,pos}=activePosition();if(game.players==='solo'&&team===1&&!auto)return false;const player=playerAt(id);if(!player||!eligible(pos,team,slot).some(p=>p.id===id))return false;if(game.mode==='era'&&(!game.offer||!game.offer.ids.includes(id)))return false;const signed=eligible(pos,team,slot).find(p=>p.id===id)||player;game.teams[team].lineup.push(signed);game.step++;game.offer=null;toast(`✅ ${signed.name} drafted by ${game.teams[team].name} · ${pos}${signed.emergency?" · minimum contract":""}`);if(game.step>=rosterSlots(0).length*2){game.phase='preMatch'}persist();renderGame();return true}

function strength(i){const t=game.teams[i],ov=averageRating(i),m=tacticsMatchup();const synergy={soccer:{'4-3-3':.8,'4-2-3-1':1.1,'3-5-2':.5},nba:{'Starting Five':1},nfl:{'Full 22':1,'Offense Only':-.5}};const tactical=(i===0?m.edge:-m.edge);return ov+tactical+(synergy[game.sport][t.formation]||0)}
function getPlayers(i,roles){const list=game.teams[i].lineup.filter(p=>p.positions.some(x=>roles.includes(x)));return list.length?list:game.teams[i].lineup}
function weightedPlayer(team,roles){const pool=getPlayers(team,roles);return chooseWeighted(pool,p=>Math.max(1,(p.rating-67)/4))}
function chooseWeighted(arr,weight){if(!arr.length)return null;const weights=arr.map(weight),total=weights.reduce((a,b)=>a+b,0);let r=Math.random()*total;for(let i=0;i<arr.length;i++){r-=weights[i];if(r<=0)return arr[i]}return arr[arr.length-1]}
function poisson(lambda){let L=Math.exp(-lambda),p=1,k=0;do{k++;p*=Math.random()}while(p>L&&k<11);return k-1}
function numPart(total,count,weights){let a=Array(count).fill(0);if(!count)return a;for(let i=0;i<total;i++){const idx=chooseWeighted([...Array(count).keys()],j=>weights[j]);a[idx]++}return a}
function groupPower(t,roles){
 const players=game.teams[t].lineup.filter((p,i)=>roles.includes(rosterSlots(t)[i]));
 return players.length?players.reduce((a,p)=>a+p.rating,0)/players.length:averageRating(t);
}
function positionalMatchup(){
 const sport=game.sport;
 const roles=sport==='soccer'?{attack:['ST','LW','RW','CAM'],def:['GK','CB','LB','RB','CDM','RWB','LWB']}:
 sport==='nba'?{attack:['PG','SG','SF'],def:['PF','C','SF']}:
 {attack:['QB','WR','RB','TE'],def:['EDGE','DT','LB','CB','FS','SS']};
 const offense=[groupPower(0,roles.attack),groupPower(1,roles.attack)];
 const defense=[groupPower(0,roles.def),groupPower(1,roles.def)];
 const pressure=((offense[0]-defense[1])-(offense[1]-defense[0]))*.26;
 return {offense,defense,edge:clamp(pressure,-5,5)};
}
function matchGame(){const sport=game.sport,strA=strength(0),strB=strength(1),matchup=positionalMatchup(),diff=clamp(strA-strB+matchup.edge,-15,15);const result=sport==='soccer'?soccerMatch(diff):sport==='nba'?basketMatch(diff):nflMatch(diff);result.scouting={edge:matchup.edge,offense:matchup.offense,defense:matchup.defense,tactics:tacticsMatchup().message};return result}
function soccerMatch(diff){let scores=[clamp(poisson(Math.max(.65,1.65+diff*.10)),0,6),clamp(poisson(Math.max(.65,1.65-diff*.10)),0,6)],teamStats=[],events=[],lineStats=[[],[]];for(let t=0;t<2;t++){const team=game.teams[t];let power=averageRating(t);const poss=clamp(Math.round(50+diff*(t===0?1:-1)*1.2+rand(-7,7)),32,68),shots=rand(Math.max(6,scores[t]+5),Math.max(12,scores[t]+13)),on=rand(Math.max(scores[t]+1,3),Math.min(shots,11));teamStats.push({possession:poss,shots,on,xg:Math.max(.4,shots*.11+scores[t]*.12).toFixed(2),corners:rand(2,9),fouls:rand(5,17),saves:0});lineStats[t]=team.lineup.map(p=>({player:p.name,position:p.positions[0],G:0,A:0,S:0}));for(let g=0;g<scores[t];g++){const scorer=weightedPlayer(t,['ST','RW','LW','CAM','CM']),minute=rand(6,88);const assist=weightedPlayer(t,['CM','CAM','RW','LW','RB','LB']);const rec=lineStats[t].find(x=>x.player===scorer.name);if(rec){rec.G++;rec.S+=rand(1,2)}const helper=assist?.name!==scorer.name?assist:null;if(helper){const ar=lineStats[t].find(x=>x.player===helper.name);if(ar)ar.A++}events.push({at:minute,side:t,points:1,type:'GOAL',text:`⚽ ${scorer.name} scores${helper?' · assisted by '+helper.name:''}!`})}
// Distribute every team shot to a player while preserving each goal scorer's minimum attempts.
lineStats[t].forEach(x=>x.S=x.G);const remainingShots=Math.max(0,teamStats[t].shots-scores[t]);const weights=lineStats[t].map(x=>(['ST','RW','LW','CAM'].includes(x.position)?8:['CM','CDM'].includes(x.position)?4:1));const allocated=numPart(remainingShots,lineStats[t].length,weights);lineStats[t].forEach((x,i)=>x.S+=allocated[i]);}teamStats[0].possession=clamp(teamStats[0].possession,33,67);teamStats[1].possession=100-teamStats[0].possession;teamStats[0].saves=teamStats[1].on-scores[1];teamStats[1].saves=teamStats[0].on-scores[0];const other=['A brilliant through ball splits the back line.','The goalkeeper makes a fingertip save!','A dangerous counterattack is stopped.','A shot curls narrowly wide.','A defender wins a crucial tackle.','The midfield battles for control.'];for(let j=0;j<8;j++)events.push({at:rand(2,89),side:rand(0,1),points:0,type:'MOMENT',text:choose(other)});events.sort((a,b)=>a.at-b.at||Number(a.type!=='GOAL')-Number(b.type!=='GOAL'));let penalties=null,winner=scores[0]>scores[1]?0:scores[1]>scores[0]?1:-1;if(winner===-1){winner=Math.random()<clamp(.5+diff*.025,.2,.8)?0:1;penalties=winner===0?[5,4]:[4,5];events.push({at:120,side:winner,points:0,type:'PENALTIES',text:`🎯 Penalty shootout! ${game.teams[winner].name} wins ${penalties[winner]}–${penalties[1-winner]} on penalties.`})}return{sport:'soccer',scores,events,stats:teamStats,playerStats:lineStats,penalties,winner}}
function basketMatch(diff){const q0=[0,0,0,0],q1=[0,0,0,0],events=[],box=[],strengths=[diff,-diff];for(let t=0;t<2;t++){const qs=t===0?q0:q1;for(let q=0;q<4;q++)qs[q]=clamp(Math.round(27+strengths[t]*.32+rand(-8,8)),16,41)}let scores=[q0.reduce((a,b)=>a+b,0),q1.reduce((a,b)=>a+b,0)];if(scores[0]===scores[1]){const w=Math.random()<clamp(.5+diff*.022,.2,.8)?0:1;scores[w]+=rand(3,8);events.push({at:49,side:w,points:0,type:'OVERTIME',text:'⏱️ Overtime drama decides the game!'})}for(let t=0;t<2;t++){const qs=t===0?q0:q1;const team=game.teams[t];const weights=team.lineup.map(p=>p.rating-55);const pts=numPart(scores[t],team.lineup.length,weights);box[t]=team.lineup.map((p,i)=>({player:p.name,PTS:pts[i],REB:rand(2,13)+(p.positions.includes('C')?3:0),AST:rand(1,10)+(p.positions.includes('PG')?3:0)}));for(let q=0;q<4;q++){let stars=box[t].slice().sort((a,b)=>b.PTS-a.PTS);events.push({at:12*(q+1),side:t,points:qs[q],type:'QUARTER',text:`${game.teams[t].name} put up ${qs[q]} in Q${q+1}. ${stars[0].player} sets the tone.`})}}// Each quarter contributes to the visible scoreboard; overtime adds the exact difference if any.

function nflMatch(diff){const event=[],scores=[0,0],stats=[],box=[];for(let t=0;t<2;t++){const team=game.teams[t],full=team.formation==='Full 22';const target=Math.max(2,Math.min(38,Math.round(21+(t===0?diff:-diff)*.8+rand(-12,12))));let remaining=target,minutes=[],td=0,fg=0;while(remaining>=7&&td<5&&(remaining>=11||td===0)){if(Math.random()<.72){td++;remaining-=7}else break}while(remaining>=3&&fg<5){fg++;remaining-=3}scores[t]=td*7+fg*3;let segments=Array(td).fill(7).concat(Array(fg).fill(3));segments.forEach((points,i)=>{const player=points===7?weightedPlayer(t,['WR','TE','RB']):null;event.push({at:rand(3,58),side:t,points,type:points===7?'TOUCHDOWN':'FIELD GOAL',text:points===7?`🏈 Touchdown! ${player?.name||'The offense'} finishes a huge drive.`:`🥅 Field goal! ${team.name} add three.`})});const qb=team.lineup.find(p=>p.positions.includes('QB'));const rb=team.lineup.find(p=>p.positions.includes('RB'));const passYards=rand(170,345)+Math.round((averageRating(t)-90)*2),rushYards=rand(70,180);stats[t]={passYards,rushYards,firstDowns:rand(12,28),sacks:rand(0,4),turnovers:rand(0,3)};const receivers=team.lineup.filter(p=>p.positions.some(role=>['WR','TE'].includes(role))).slice(0,5);const recYards=numPart(passYards,receivers.length,receivers.map(p=>p.rating-65));box[t]=[{player:qb?.name||'Quarterback',role:'QB',STAT:`${passYards} PASS YDS · ${td} PASS TD`},{player:rb?.name||'Running back',role:'RB',STAT:`${rushYards} RUSH YDS`},...receivers.map((p,i)=>({player:p.name,role:p.positions[0],STAT:`${recYards[i]} REC YDS`}))]}

function startMatch(){if(!game||game.phase!=='preMatch'||!complete())return;resetWatchControls();if(game.players==='solo')game.teams[1].tactic=choose(SPORT[game.sport].tactics);game.match=matchGame();game.watchIndex=0;game.phase='watch';persist();renderGame()}
function watchMoments(){if(!game||game.phase!=='watch')return;watchPaused=false;clearInterval(watchTimer);watchTimer=setInterval(()=>{if(!game||game.phase!=='watch'){clearInterval(watchTimer);return}game.watchIndex++;renderMatch();if(game.watchIndex>=game.match.events.length){clearInterval(watchTimer);watchTimer=null;setTimeout(()=>{if(game?.phase==='watch')finishWatch()},550)}},Math.round(430/watchSpeed));renderMatch()}

function statsRows(){const m=game.match;if(!m)return'';const a=m.stats[0],b=m.stats[1];if(m.sport==='soccer')return metricRow('Possession %',a.possession,b.possession)+metricRow('Shots',a.shots,b.shots)+metricRow('Shots on target',a.on,b.on)+metricRow('Expected goals (model)',a.xg,b.xg)+metricRow('Corners',a.corners,b.corners)+metricRow('Fouls',a.fouls,b.fouls)+metricRow('Goalkeeper saves',a.saves,b.saves);if(m.sport==='nba')return metricRow('Field goals % (model)',a.fg,b.fg)+metricRow('Three-pointers made',a.three,b.three)+metricRow('Rebounds',a.reb,b.reb)+metricRow('Assists',a.ast,b.ast)+metricRow('Turnovers',a.turnovers,b.turnovers);return metricRow('Passing yards',a.passYards,b.passYards)+metricRow('Rushing yards',a.rushYards,b.rushYards)+metricRow('First downs',a.firstDowns,b.firstDowns)+metricRow('Sacks',a.sacks,b.sacks)+metricRow('Turnovers',a.turnovers,b.turnovers)}
function boxPlayerStats(t){const m=game.match;const arr=m.playerStats[t]||[];const headers=m.sport==='soccer'?['PLAYER','G','A','S']:m.sport==='nba'?['PLAYER','PTS','REB','AST']:['PLAYER','ROLE','GAME STATS'];return `<div class="panel"><h3>${esc(game.teams[t].name)} · Simulated box score</h3><table class="leaderboard"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${arr.map(p=>`<tr>${headers.map(k=>`<td>${esc(p[k]??p[k==='PLAYER'?'player':k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function renderMatch(back=''){const m=game.match;if(!m){game.phase='preMatch';return renderGame()}const watching=game.phase==='watch';const shown=watching?scoreShown():m.scores;const isDone=!watching;const feed=m.events.slice(0,game.watchIndex);root.innerHTML=`${back}<div class="match-hero"><div class="split-title"><div class="eyebrow">${SPORT[game.sport].emoji} ${esc(SPORT[game.sport].name)} · MATCH ${game.games.length+(watching?1:0)} / ${game.series}</div><span class="tag">${watching?'● LIVE SIMULATION · '+playByPlayClock()+(m.sport==='soccer'?"'":'m'):'FULL TIME'}</span></div><div class="match-scores"><div><div class="team-chip blue">HOME</div><h2>${esc(game.teams[0].name)}</h2><p class="subtitle">${esc(game.teams[0].formation)}</p></div><div><h1>${shown[0]} <span class="muted">:</span> ${shown[1]}</h1><div class="eyebrow">${watching?`${feed.length}/${m.events.length} MOMENTS`:`WINNER · ${esc(game.teams[m.winner].name)}`}</div>${!watching&&m.penalties?`<p class="small">Penalties ${m.penalties[0]}–${m.penalties[1]}</p>`:''}</div><div><div class="team-chip red">AWAY</div><h2>${esc(game.teams[1].name)}</h2><p class="subtitle">${esc(game.teams[1].formation)}</p></div></div><div class="scoretop"><span class="small muted">SERIES: ${game.wins[0]}–${game.wins[1]}</span><span class="small muted">${watching?'Simulation events, not a video rendering':'All match statistics are simulation-generated'}</span></div></div><div class="two-col" style="margin-top:17px"><section class="panel"><div class="split-title"><h3>🎥 Match highlights</h3><span class="tag">${feed.length} EVENTS</span></div>${watching?`<div class="button-row"><button class="btn primary" onclick="toggleWatch()">${watchTimer&&!watchPaused?'⏸ Pause':game.watchIndex?'▶ Resume':'▶ Watch'} highlights</button><button class="btn ghost" onclick="setWatchSpeed()">⚡ ${watchSpeed}× speed</button><button class="btn ghost" onclick="skipWatch()">⏭ Final score</button></div><div class="watch-progress"><span style="width:${m.events.length?game.watchIndex/m.events.length*100:0}%"></span></div>`:`<div class="mvp-callout">${gameMVP()?`<div class="eyebrow">⭐ PLAYER OF THE MATCH · ${esc(game.teams[m.winner].name)}</div><strong>${esc(gameMVP().name)}</strong><small>${esc(gameMVP().line)}</small>`:''}</div><div class="callout">${esc(game.teams[m.winner].name)} take Game ${m.index}. ${game.phase==='seriesEnd'?'The championship has been decided!':'The losing side can respond with one roster move.'}</div>`}<div class="timeline" id="timeline">${feed.length?feed.map(e=>`<div class="event"><b>${e.at}${m.sport==='soccer'?"'":m.sport==='nba'?'m':'m'}</b><div><div class="small muted">${e.type} · ${esc(game.teams[e.side].name)}</div>${esc(e.text)}</div></div>`).join(''):'<div class="empty">Press Watch to see match moments unfold, or skip to the final result.</div>'}</div></section><section class="panel"><h3>📊 Team statistics</h3>${m.scouting?`<div class="scout-advice"><strong>🧠 POSITIONAL MATCHUP</strong><p>${m.scouting.edge>1?'🔵 Blue attack/defense match up well':m.scouting.edge < -1?'🔴 Red attack/defense match up well':'⚖️ Even positional matchup'} · ${esc(m.scouting.tactics)}</p></div>`:''}${statsRows()}<p class="footnote">Generated from the fantasy simulation. These are not historical real-world game statistics.</p></section></div>${!watching?`<div class="form-grid">${boxPlayerStats(0)}${boxPlayerStats(1)}</div><div class="panel"><h3>Series · ${game.wins[0]}–${game.wins[1]}</h3><div class="button-row">${game.phase==='seriesEnd'?`<button class="btn primary" onclick="renderSeriesEnd()">🏆 SEE THE CHAMPIONS</button>`:`<button class="btn primary" onclick="beginIntermission()">🔁 Roster changes → Game ${game.games.length+1}</button>`}<button class="btn ghost" onclick="downloadSummary()">↓ Download match report</button></div></div>`:''}`;const line=$('timeline');if(line)line.scrollTop=line.scrollHeight}
function beginIntermission(){if(!game||game.phase!=='postMatch')return;game.phase='intermission';game.subTurn=0;game.swapSlot=null;persist();renderGame()}
function startNextGame(){game.phase='preMatch';game.match=null;game.watchIndex=0;game.swapSlot=null;persist();renderGame()}
function changeFormation(value){if(game.phase!=='intermission'||(game.players==='solo'&&game.subTurn===1))return;const t=game.subTurn,team=game.teams[t],newSlots=SPORT[game.sport].forms[value];if(!newSlots)return;const old=team.lineup.slice();if(newSlots.length!==old.length){toast('That formation needs a different roster size. Choose it before drafting a new team.');renderIntermission();return}const taken=new Set(),ans=Array(newSlots.length).fill(null);function solve(idx){if(idx>=newSlots.length)return true;const target=newSlots[idx];const order=old.map((p,i)=>({p,i,priority:p.positions[0]===target?0:1})).filter(x=>x.p.positions.includes(target)&&!taken.has(x.i)).sort((a,b)=>a.priority-b.priority);for(const {p,i} of order){taken.add(i);ans[idx]=p;if(solve(idx+1))return true;taken.delete(i)}return false}if(!solve(0)){toast('This roster cannot cover every spot in that formation. Try a different one or change your players.');renderIntermission();return}team.formation=value;team.lineup=ans;persist();renderGame()}
function selectSwap(slot){if(game.phase!=='intermission'||(game.players==='solo'&&game.subTurn===1))return;game.swapSlot=slot;persist();renderIntermission()}
function swapEligible(){if(game.phase!=='intermission'||game.swapSlot===null)return[];const t=game.subTurn,slot=game.swapSlot,used=athleteUsed(t,slot),pos=rosterSlots(t)[slot],budget=game.teams[t].budget,cost=totalCost(game.teams[t])-moneyPrice(game.teams[t].lineup[slot]);return DATA[game.sport].filter(p=>p.positions.includes(pos)&&!used.has(p.name)&&(game.mode!=='salary'||cost+moneyPrice(p)<=budget)).sort((a,b)=>b.rating-a.rating)}
function confirmSwap(id,auto=false){if(!game||game.phase!=='intermission'||game.swapSlot===null||(game.players==='solo'&&game.subTurn===1&&!auto))return;const p=playerAt(id);if(!p||!swapEligible().some(x=>x.id===id))return;game.teams[game.subTurn].lineup[game.swapSlot]=p;finishSubTurn()}
function finishSubTurn(auto=false){if(game.players==='solo'&&game.subTurn===1&&!auto)return;game.swapSlot=null;game.subTurn++;if(game.subTurn>=2)startNextGame();else{persist();renderGame()}}
function renderIntermission(back=''){const t=game.subTurn,team=game.teams[t],s=SPORT[game.sport],isAI=game.players==='solo'&&t===1;const swaps=game.swapSlot===null?[]:swapEligible();root.innerHTML=`${back}<div class="heading"><div><div class="eyebrow">INTERMISSION · GAME ${game.games.length} COMPLETE</div><h2>ONE CHANGE. <span class="accent">ONE CHANCE.</span></h2><p>${esc(team.name)} may replace exactly one player or keep the lineup. Tactics and compatible formations can change freely.</p></div><span class="tag">SERIES ${game.wins[0]}–${game.wins[1]}</span></div><div class="side-panel"><div><section class="panel"><div class="split-title"><h3>${esc(team.name)} · Roster adjustment</h3><span class="tag">1 PLAYER CHANGE MAX</span></div><label class="field">Formation (no substitution cost)<select onchange="changeFormation(this.value)" ${isAI?'disabled':''}>${Object.keys(s.forms).map(f=>`<option value="${esc(f)}" ${team.formation===f?'selected':''}>${esc(f)}</option>`).join('')}</select></label><label class="field" style="margin:14px 0">Tactics<select onchange="setTactic(${t},this.value)" ${isAI?'disabled':''}>${s.tactics.map(x=>`<option ${team.tactic===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><h3>${isAI?'🤖 AI is choosing a roster move…':'Tap one position to replace'}</h3><div class="roster-list">${rosterSlots(t).map((pos,i)=>`<button style="text-align:left;border:0;padding:0;background:none;color:inherit" onclick="selectSwap(${i})" ${isAI?'disabled':''}>${rosterRow(team.lineup[i],pos,i,t)}</button>`).join('')}</div>${game.swapSlot!==null?`<div class="accent-line"></div><h3>Replace ${esc(team.lineup[game.swapSlot].name)} (${rosterSlots(t)[game.swapSlot]})</h3><label class="field">Search replacement<input class="input" id="swapSearch" oninput="filterSwap()" placeholder="Search all eras..."></label><div class="candidate-list" id="swapList" style="margin-top:9px">${swaps.map(p=>chosenCard(p,{action:`confirmSwap('${p.id}')`,showCost:game.mode==='salary'})).join('')}</div>`:''}<div class="button-row" style="margin-top:17px"><button class="btn ghost" onclick="finishSubTurn()" ${isAI?'disabled':''}>Keep lineup · No change →</button></div></section></div><div><section class="panel"><h3>Series so far</h3><div class="stats-strip" style="grid-template-columns:1fr 1fr"><div class="stat"><strong>${game.wins[0]}</strong><span>${esc(game.teams[0].name)}</span></div><div class="stat"><strong>${game.wins[1]}</strong><span>${esc(game.teams[1].name)}</span></div></div><p class="small">${game.subTurn===0?'Player one goes first for the between-game change.':'Player two now gets the same opportunity.'}</p>${game.mode==='salary'?`<p class="small">Salary cap left: <strong>${team.budget-totalCost(team)} fantasy credits</strong>. Selling a player refunds their price.</p>`:''}</section>${rosterPanel(1-t)}</div></div>`;if(isAI)scheduleAIIntermission()}
function scheduleAIIntermission(){clearTimeout(aiTimer);aiTimer=setTimeout(()=>{aiTimer=null;if(!game||game.phase!=='intermission'||game.players!=='solo'||game.subTurn!==1)return;const t=1,team=game.teams[1];const tactics=SPORT[game.sport].tactics;team.tactic=choose(tactics);let best=null;for(let slot=0;slot<team.lineup.length;slot++){game.swapSlot=slot;const old=team.lineup[slot];const upgrade=swapEligible().filter(p=>p.rating>=old.rating+1).sort((a,b)=>b.rating-a.rating)[0];if(upgrade&&(!best||upgrade.rating-old.rating>best.gain))best={slot,p:upgrade,gain:upgrade.rating-old.rating}}if(best&&Math.random()<.82){game.swapSlot=best.slot;confirmSwap(best.p.id,true)}else{game.swapSlot=null;finishSubTurn(true)}},900)}
function filterSwap(){const str=($('swapSearch')?.value||'').toLowerCase();if(!$('swapList'))return;$('swapList').innerHTML=swapEligible().filter(p=>(p.name+' '+p.team+' '+p.season).toLowerCase().includes(str)).map(p=>chosenCard(p,{action:`confirmSwap('${p.id}')`,showCost:game.mode==='salary'})).join('')||'<p class="empty">No matching players.</p>'}

function howView(){root.innerHTML=`<div class="heading"><div><div class="eyebrow">THE PLAYBOOK</div><h2>How to Play Era Rivals</h2></div></div><div class="two-col"><section class="panel"><h3>01 · Choose your sport</h3><p>All-Star XI has three formations and 11 positions. Build the Best Five drafts PG, SG, SF, PF and C. Build the Gridiron offers a full 22-player offense/defense or a quicker 11-player offense.</p><h3>02 · Select a draft mode</h3><p><strong>Classic:</strong> Open fantasy All-Star pool.<br><strong>Salary Cap:</strong> Choose from fixed fantasy credit prices. Save enough for every position.<br><strong>Era Spin:</strong> Spin for a specific club/franchise and decade, then pick an eligible player from that team and era. Two rerolls per team.<br><strong>Blind:</strong> The game hides editorial player ratings until the entire draft is finished.</p><h3>03 · Alternate first picks</h3><p>Each round is for a position. Player one picks first in round one; player two picks first in round two. It alternates throughout. No duplicate players on the two squads.</p><h3>04 · Simulate the series</h3><p>Choose tactics. Watch generated play-by-play, scorelines and full box scores. Soccer and American football use best-of-three series. Basketball uses best-of-seven.</p><h3>05 · One replacement</h3><p>Between games, each team can swap at most one player. You can also skip the replacement. Compatible formation and tactic changes don't cost the swap. Salary Cap replacements must remain under the cap.</p></section><section class="panel"><h3>📊 Important stats details</h3><p>Each player is linked to a real historical team and season. The Era Spin wheel uses that record to filter eligible candidates.</p><p><strong>Verified snapshot</strong> means the offline database contains a real historical statistic with a source URL. Only those figures should be treated as real statistics.</p><p><strong>Overall rating</strong> is a fictional, editorial game number designed to balance the fantasy simulation. <strong>Fantasy credits</strong> are game prices, not contracts, valuations or real-world salaries.</p><p>Players without verified snapshots still have the accurate position, historic team/era record and an editorial rating. We do not invent a historical PPG or goals total to fill empty fields.</p><h3>🕹️ Original separate Auction Game</h3><p>The Auction Game is now a separate project. Era Rivals focuses on the three flagship sports.</p><h3>Privacy and backups</h3><p>Games, settings and results are saved in this browser's local storage. Clearing your browser's site data or switching browsers can remove saves. Export your championship report to keep a copy.</p><h3>Licensing</h3><p>Fan-made prototype; not affiliated with FIFA, UEFA, NBA, NFL, athletes, teams or data providers. If distributing commercially, check names, logos, player likenesses, data licensing and branding rights.</p></section></div>`}

function cuMatchScore(i,j){let power=cuTeamPower(i),opp=j?cuTeamPower(j):cuRand(65,95);const diff=power-opp;let home,away;if(cu.sport==='nba'){home=Math.max(69,Math.round(102+diff*.65+cuRand(-14,14)));away=Math.max(69,Math.round(102-diff*.45+cuRand(-14,14)))}else if(cu.sport==='nfl'){home=Math.max(0,Math.round(23+diff*.36+cuRand(-10,10)));away=Math.max(0,Math.round(23-diff*.30+cuRand(-10,10)))}else{home=Math.max(0,Math.round(1.6+diff*.065+cuRand(-2,2)));away=Math.max(0,Math.round(1.5-diff*.05+cuRand(-2,2)))}if(home===away&&cu.sport!=='soccer'){if(Math.random()<.5)home+=cu.sport==='nba'?2:3;else away+=cu.sport==='nba'?2:3}return [home,away]}

function cuResult(matches){let finished=cu.week>=cu.totalWeeks;root.innerHTML=`<div class="heading"><div><div class="eyebrow">MATCHWEEK RESULTS · ${cu.year}</div><h2>${finished?'🏆 SEASON COMPLETE':'FULL TIME · WEEK '+cu.week}</h2></div></div><div class="career-cols">${matches.slice(0,cu.players==='two'?2:1).map((m,i)=>`<div class="career-game-screen"><span class="c-pill">${i?'🔴 PLAYER TWO':'🔵 PLAYER ONE'}</span><h2>${cuEsc(cu.track==='player'?cu.athletes[i].name:cu.clubs[i])}</h2><div class="career-score">${m.scores[0]} – ${m.scores[1]}</div><p>vs ${cuEsc(m.opponent)}</p><h3 class="c-glow">${m.scores[0]>m.scores[1]?'VICTORY':m.scores[0]===m.scores[1]?'DRAW':'DEFEAT'}</h3><p class="small">${cu.track==='player'?'Performance, training and progression recorded.':'Club finances and league standings updated.'}</p></div>`).join('')}</div><div class="career-section c-panel"><h3>📺 Match Highlights</h3><div class="career-feed"><div>${cu.sport==='nba'?'A crucial fourth-quarter possession swings the contest.':cu.sport==='nfl'?'Late down-and-distance decisions shape the final drive.':'The decisive chance comes as the final whistle approaches.'}</div><div>${cu.track==='player'?'Your created athlete earns experience.':'Your manager decisions influence the simulated strength of your squad.'}</div><div>📊 Results saved to your shared career calendar.</div></div><div class="button-row" style="margin-top:14px">${finished?'<button class="btn primary" onclick="cuEndSeason()">🏆 REVIEW CHAMPIONSHIP</button>':'<button class="btn primary" onclick="cuDashboard()">CONTINUE CAREER →</button>'}<button class="btn ghost" onclick="cuStandings()">VIEW STANDINGS</button></div></div>`}

function erPlayPost(){const p=erGetPost(),two=cu.players==='two',atFinal=p.round===erPostRounds()-1,headToHead=two&&cu.relationship==='rivals'&&atFinal&&p.alive[0]&&p.alive[1]&&p.eligible[0]&&p.eligible[1],results=[];let headResult=null;if(headToHead)headResult=cuMatchScore(0,1);for(let i=0;i<(two?2:1);i++){if(!p.eligible[i]||!p.alive[i])continue;let [a,b]=headToHead?(i===0?headResult:[headResult[1],headResult[0]]):cuMatchScore(i);if(cu.sport==='nba'){const win=a>b,won=win?4:cuRand(0,3),lost=win?cuRand(0,3):4;results.push({team:i,name:cu.clubs[i],score:won+'-'+lost,winner:win,opponent:headToHead?cu.clubs[1-i]:cuFacing(i)});if(!win)p.alive[i]=false}else{const win=a===b?(Math.random()<.5):a>b;results.push({team:i,name:cu.clubs[i],score:a+'-'+b,winner:win,opponent:headToHead?cu.clubs[1-i]:cuFacing(i)});if(!win)p.alive[i]=false}}
 p.results.push({round:p.round,label:erPostLabel(p.round),results});p.round++;if(p.round>=erPostRounds()||!p.alive.slice(0,two?2:1).some((v,i)=>v&&p.eligible[i])){p.finished=true;for(let i=0;i<(two?2:1);i++){if(p.eligible[i]&&p.alive[i]){p.champions.push(i);cu.awards.push({year:cu.year,title:erPostLabel(erPostRounds()-1)+' Champion',record:cu.records[i].w+'-'+cu.records[i].l,player:i})}}}cuSave();erPostRoundResult(results)}
function erPostRoundResult(results){const p=erGetPost();root.innerHTML=`<div class="heading"><div><div class="eyebrow">PLAYOFFS & CUPS · ${cu.year}</div><h2>${p.finished?'🏆 POSTSEASON COMPLETE':'POSTSEASON RESULTS'}</h2></div></div><div class="career-cols">${results.map(r=>`<div class="c-panel"><span class="c-pill">PLAYER ${r.team+1}</span><h3>${cuEsc(r.name)}</h3><h2>${cuEsc(r.score)}</h2><p>vs ${cuEsc(r.opponent)}</p><strong style="color:${r.winner?'#d7fa72':'#f4879e'}">${r.winner?'ADVANCES':'ELIMINATED'}</strong></div>`).join('')||'<div class="c-panel">No remaining qualifiers.</div>'}</div><div class="button-row"><button class="btn primary" onclick="cuEndSeason()">${p.finished?'🏆 SEE SEASON REPORT':'CONTINUE POSTSEASON →'}</button></div>`}
function erPostSummary(){const p=erGetPost(),count=cu.players==='two'?2:1;root.innerHTML=`<div class="results-highlight"><div class="eyebrow">ERA RIVALS · ${cu.year} SEASON</div><h1>🏆 SEASON COMPLETE</h1><h3>${cuEsc(cuVenue())}</h3><p>${p.champions.length?p.champions.map(i=>cuEsc(cu.track==='player'?cu.athletes[i].name:cu.clubs[i])).join(' & ')+' won a postseason trophy!':'Season complete. The offseason begins.'}</p><div class="button-row"><button class="btn primary" onclick="cuNextSeason()">▶ START NEXT SEASON</button><button class="btn ghost" onclick="cuDashboard()">Career Hub</button></div></div><section class="c-panel"><h3>Final Records</h3>${Array.from({length:count},(_,i)=>`<div class="er-record-row"><b>${cuEsc(cu.clubs[i])}</b><span>${cu.records[i].w}-${cu.records[i].l} ${cu.sport==='soccer'?'-'+cu.records[i].d:''}</span><strong>${p.champions.includes(i)?'🏆 CHAMPION':p.eligible[i]?'PLAYOFF TEAM':'NO PLAYOFFS'}</strong></div>`).join('')}<h3>Postseason Results</h3>${p.results.map(r=>`<h4>${cuEsc(r.label)}</h4>${r.results.map(a=>`<div class="er-record-row"><b>${cuEsc(a.name)}</b><span>${cuEsc(a.score)}</span><strong>${a.winner?'Advance':'Eliminated'}</strong></div>`).join('')}`).join('')}</section>`;cuSave()}

// Improve progression: each MyPLAYER can spend their own XP on chosen attributes.
const _erOldTraining=erTraining;
erTraining=function(i){if(!cu||i>=(cu.players==='two'?2:1))return;if(cu.track==='player')return erSkillTraining(i);return _erOldTraining(i)};
function erSkillTraining(i){const p=cu.athletes[i];root.innerHTML=`<div class="heading"><div><div class="eyebrow">PLAYER ${i+1} · DEVELOPMENT</div><h2>TRAIN ${cuEsc(p.name)}</h2><p>${cu.xp[i]} XP available · each upgrade costs 20 XP · gain +2 in a chosen skill (up to 99).</p></div></div><div class="er-builder-layout"><div class="c-panel er-preview">${erAvatarSVG({...p.erAppearance,name:p.name,number:p.number},true)}<h3>${cuEsc(p.position)}</h3><h2>${cu.rating[i]} OVR</h2><p>${cu.xp[i]} XP remaining</p></div><div class="c-panel"><h3>Choose what to improve</h3><div class="er-training-list">${ER_SKILLS[cu.sport].map(([k,label])=>`<button onclick="erUpgradeStat(${i},'${k}')" ${cu.xp[i]<20||p.erSkills[k]>=99?'disabled':''}><span>${label}</span><b>${p.erSkills[k]} → ${Math.min(99,p.erSkills[k]+2)}</b><strong>20 XP</strong></button>`).join('')}</div><div class="button-row"><button class="btn primary" onclick="cuDashboard()">FINISH TRAINING</button></div></div></div>`}
function erUpgradeStat(i,k){const p=cu.athletes[i];if(cu.xp[i]<20||!Object.hasOwn(p.erSkills,k)||p.erSkills[k]>=99)return;cu.xp[i]-=20;p.erSkills[k]=Math.min(99,p.erSkills[k]+2);erSyncCore(p);cu.rating[i]=Math.round(Object.values(p.erSkills).reduce((s,n)=>s+n,0)/12);cu.history.push(p.name+' improved '+k+' through training.');cuSave();erSkillTraining(i)}
function erChangeBuildPosition(pos){if(!cu)return;const p=cu.athletes[cuCurrentTab];if(!CU_LEAGUES[cu.sport].positions.includes(pos))return;p.position=pos;cuSave();cuBuilder()}
const _erBaseBuilder=cuBuilder;
cuBuilder=function(){_erBaseBuilder();const title=document.querySelector('.er-builder-layout .c-panel:nth-child(2)>h3');if(title){const box=document.createElement('label');box.className='er-position-switch';box.innerHTML=`Change position<select class="c-select" onchange="erChangeBuildPosition(this.value)">${CU_LEAGUES[cu.sport].positions.map(pos=>`<option ${cu.athletes[cuCurrentTab].position===pos?'selected':''}>${pos}</option>`).join('')}</select>`;title.after(box)}};

/* Position-aware fantasy attributes and stage-appropriate standings. */
erPlayerRatings=function(p){const sport=['nba','nfl','soccer'].includes(String(p.id||'').split('-')[0])?String(p.id).split('-')[0]:(cu?.sport||game?.sport||'nba'),pos=p.position||p.positions?.[0]||'PLAYER',ov=p.rating||p.overall||72;
 const soccer={GK:['GK Diving','GK Reflexes','GK Handling','GK Positioning','Kicking','Composure'],CB:['Marking','Tackling','Interceptions','Strength','Heading','Pace'],RB:['Pace','Crossing','Tackling','Stamina','Passing','Awareness'],LB:['Pace','Crossing','Tackling','Stamina','Passing','Awareness'],RWB:['Pace','Crossing','Tackling','Dribbling','Passing','Stamina'],LWB:['Pace','Crossing','Tackling','Dribbling','Passing','Stamina'],CDM:['Defensive IQ','Interceptions','Passing','Stamina','Tackling','Positioning'],CM:['Passing','Vision','Ball Control','Stamina','Tackling','Shooting'],CAM:['Vision','Passing','Dribbling','First Touch','Finishing','Creativity'],RW:['Pace','Dribbling','Crossing','Finishing','Agility','Vision'],LW:['Pace','Dribbling','Crossing','Finishing','Agility','Vision'],ST:['Finishing','Positioning','Pace','Heading','Dribbling','Strength']};
 const nba={PG:['Playmaking','Ball Handle','Passing','Three-Point','Perimeter D','Speed'],SG:['Shooting','Three-Point','Finishing','Midrange','Perimeter D','Speed'],SF:['Finishing','Shooting','Perimeter D','Athleticism','Passing','Rebounding'],PF:['Interior D','Rebounding','Strength','Finishing','Midrange','Positioning'],C:['Interior D','Rebounding','Blocking','Strength','Finishing','Post Footwork']};
 const nfl={QB:['Throw Accuracy','Throw Power','Pocket IQ','Mobility','Awareness','Play Action'],RB:['Acceleration','Ball Carrier','Vision','Elusiveness','Break Tackle','Catching'],WR:['Route Running','Catching','Speed','Release','Agility','Spectacular Catch'],TE:['Catching','Route Running','Blocking','Strength','Awareness','Speed'],LT:['Pass Blocking','Run Blocking','Strength','Footwork','Awareness','Stamina'],RT:['Pass Blocking','Run Blocking','Strength','Footwork','Awareness','Stamina'],LG:['Pass Blocking','Run Blocking','Strength','Footwork','Awareness','Stamina'],RG:['Pass Blocking','Run Blocking','Strength','Footwork','Awareness','Stamina'],C:['Pass Blocking','Run Blocking','Snap IQ','Strength','Awareness','Stamina'],EDGE:['Pass Rush','Speed','Tackling','Strength','Block Shed','Awareness'],DT:['Run Defense','Strength','Block Shed','Tackling','Pass Rush','Stamina'],LB:['Tackling','Coverage','Speed','Awareness','Block Shed','Pursuit'],CB:['Coverage','Speed','Man Coverage','Zone Coverage','Press','Ball Skills'],FS:['Coverage','Zone Coverage','Speed','Awareness','Pursuit','Tackling'],SS:['Tackling','Coverage','Hit Power','Speed','Pursuit','Awareness']};
 const labels=(sport==='soccer'?soccer:sport==='nba'?nba:nfl)[pos]||['Technique','Awareness','Speed','Strength','Endurance','Skill'];return labels.map((label,ix)=>{let h=0;for(const c of String(p.name)+label)h=(h*31+c.charCodeAt(0))>>>0;const value=Math.min(99,Math.max(50,Math.round(ov-10+(h%19))));return{id:label.toLowerCase().replace(/\W+/g,'_'),label,value}})
};
cuStandings=function(){if(!cu)return;let pool=erStageTeams(0),unique=[...new Set(pool)].filter(n=>n!==cu.clubs[0]&&n!==cu.clubs[1]),weeks=cu.week,teams=unique.slice(0,12).map((name,i)=>{const w=Math.min(weeks,Math.round(weeks*(.32+.039*(i%9)))),d=cu.sport==='soccer'?Math.floor((weeks-w)*.29):0;return{name,w,l:weeks-w-d,d,pts:cu.sport==='soccer'?w*3+d:w}});
const shown=new Set();for(let i=0;i<(cu.players==='two'?2:1);i++){let name=cu.track==='player'?(cu.school?.[i]||cu.athletes[i].name):cu.clubs[i],r=cu.records[i];if(shown.has(name))continue;shown.add(name);teams.push({name,w:r.w,l:r.l,d:r.d,pts:r.points,user:true})}teams.sort((a,b)=>b.pts-a.pts||b.w-a.w);root.innerHTML=`<div class="heading"><div><div class="eyebrow">${cuEsc(cuVenue())}</div><h2>🏆 League Standings · ${cu.year}</h2><p>Known school, university and franchise names. Opponent results are fictional simulations, not official season standings.</p></div></div><section class="c-panel"><table class="c-table"><thead><tr><th>#</th><th>TEAM</th><th>W</th><th>L</th><th>PTS</th></tr></thead><tbody>${teams.map((x,i)=>`<tr ${x.user?'style="background:#243e34"':''}><td>${i+1}</td><td>${cuEsc(x.name)}</td><td>${x.w}</td><td>${x.l}</td><td>${x.pts}</td></tr>`).join('')}</tbody></table><div class="button-row" style="margin-top:14px"><button class="btn primary" onclick="cuDashboard()">← Career Hub</button></div></section>`};

/* Optional quick-action challenges: a grounded 2D interaction, not 3D match control. */
let erMiniTimer=null,erMiniState=null;
function erMiniClear(){if(erMiniTimer){clearInterval(erMiniTimer);erMiniTimer=null}document.getElementById('erMiniOverlay')?.remove()}
const _erOriginalMatch=cuRenderMatch;
cuRenderMatch=function(){_erOriginalMatch();document.querySelectorAll('.er-match-player').forEach((node,i)=>{if(!node.querySelector('.er-mini-launch')){const b=document.createElement('button');b.className='btn ghost er-mini-launch';b.textContent=cu.sport==='nba'?'🏀 Shootout Challenge':cu.sport==='nfl'?'🏈 Big-Play Challenge':'⚽ Goal Chance Challenge';b.onclick=()=>erStartMini(i);node.appendChild(b)}})};
const _erOldTeamPower=cuTeamPower;
cuTeamPower=function(i){return _erOldTeamPower(i)+(cu.skillBonus?.[i]||0)};
const _erOldSimulate=cuSimulateWeek;
cuSimulateWeek=function(){_erOldSimulate();cu.skillBonus=[0,0]};
function erStartMini(i){if(!cu)return;erMiniClear();cu.skillBonus=cu.skillBonus||[0,0];erMiniState={i,pos:0,dir:1,round:0};const overlay=document.createElement('div');overlay.id='erMiniOverlay';overlay.className='er-mini-overlay';overlay.innerHTML=`<div class="er-mini-window" role="dialog" aria-label="Interactive key moment"><div class="er-between"><span class="c-pill">${i?'🔴 PLAYER TWO':'🔵 PLAYER ONE'} · KEY MOMENT</span><button class="btn tiny ghost" onclick="erMiniClear()">✕ Close</button></div><h2>${cu.sport==='nba'?'TIME YOUR JUMPER':cu.sport==='nfl'?'READ THE DEFENSE':'CHOOSE YOUR SHOT'}</h2><p class="small">Your choice earns a simulation bonus when successful. This is a small tactical mini-game, not full real-time match control.</p><div id="erMiniPlay"></div></div>`;document.body.appendChild(overlay);erMiniDraw()}
function erMiniDraw(){let s=erMiniState;if(!s||!cu)return;const target=document.getElementById('erMiniPlay');if(!target)return;if(cu.sport==='nba'){target.innerHTML=`<div class="er-timing"><div class="er-shot-guide"><div class="er-shot-green"></div><div class="er-shot-cursor" id="erShotCursor" style="left:0%"></div></div></div><p>Stop the moving indicator in the green window.</p><button class="btn primary" onclick="erMiniStop()">🏀 RELEASE SHOT</button>`;let started=performance.now();erMiniTimer=setInterval(()=>{if(!erMiniState){erMiniClear();return}const elapsed=(performance.now()-started)/1000;erMiniState.pos=50+50*Math.sin(elapsed*3.15);const bar=document.getElementById('erShotCursor');if(bar)bar.style.left=erMiniState.pos+'%'},32)}else{const title=cu.sport==='soccer'?'Aim where the goalkeeper cannot reach':'Choose the safest passing lane';const buttons=cu.sport==='soccer'?['↖️ Top Left','⬆️ Top Center','↗️ Top Right','⬅️ Bottom Left','⏺️ Low Center','➡️ Bottom Right']:['↖️ Left sideline','⬆️ Middle seam','↗️ Right sideline'];target.innerHTML=`<p>${title}</p><div class="er-mini-field ${cu.sport}"><div class="er-mini-targets">${buttons.map((x,j)=>`<button onclick="erMiniChoice(${j})">${x}</button>`).join('')}</div></div>`}}
function erMiniStop(){if(!erMiniState||cu.sport!=='nba')return;const distance=Math.abs(erMiniState.pos-50),skill=cu.track==='player'?(cu.athletes[erMiniState.i].erSkills?.three||65):cu.teamOverall[erMiniState.i],bonus=distance<8?5:distance<16?3:distance<26?1:0;erMiniDone(bonus,bonus>=3?'GREEN RELEASE!':'Shot timing recorded')}
function erMiniChoice(x){if(!erMiniState||cu.sport==='nba')return;const skill=cu.track==='player'?cu.rating[erMiniState.i]:cu.teamOverall[erMiniState.i],defender=cuRand(0,cu.sport==='soccer'?5:2);const win=x!==defender&&(Math.random()<Math.max(.35,Math.min(.89,(skill-40)/65)));erMiniDone(win?4:0,win?'KEY PLAY SUCCESS!':'Defense wins the moment')}
function erMiniDone(bonus,message){const i=erMiniState.i;cu.skillBonus=cu.skillBonus||[0,0];cu.skillBonus[i]=Math.max(cu.skillBonus[i],bonus);erMiniClear();toast((i?'P2':'P1')+' · '+message+' · +'+bonus+' match boost');if(cu?.phase==='draft')return;cuRenderMatch()}
window.addEventListener('keydown',e=>{if(e.key==='Escape')erMiniClear()});

/* Balanced fictional season engine: opponents and tactics matter; never claims official results. */
function erStableHash(v){let h=2166136261;for(const c of String(v)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function erOpponentRating(team,year){const candidates=(DATA[cu.sport]||[]).filter(p=>p.team===team&&p.season<=year+1&&p.season>=year-7);if(candidates.length>=3)return Math.round(candidates.slice(0,10).reduce((s,p)=>s+p.rating,0)/Math.min(10,candidates.length));const offset=erStableHash(team+'_'+year)%23;return (cu.stage==='Professional'||cu.stage==='Senior Club')?72+offset:62+offset}
function erTacticalBonus(i){const p=cu.tactics[i]||'Balanced',opp=cuFacing(i),style=erStableHash(opp)%3;let bonus=0;if(p==='Attack'&&style===1)bonus+=3;else if(p==='Defend'&&style===2)bonus+=2;else if(p==='Control Possession'&&style===0)bonus+=3;else if(p==='Fast Pace'&&style===2)bonus+=3;return bonus}
cuMatchScore=function(i,j){let power=cuTeamPower(i)+erTacticalBonus(i),opponent=j!==undefined?cuTeamPower(j)+erTacticalBonus(j):erOpponentRating(cuFacing(i),cu.year);if(cu.relationship==='same'&&cu.players==='two'&&j===undefined){power+=Math.max(0,Math.round((cuTeamPower(1)-65)*.18))}
 const diff=power-opponent;
 if(cu.sport==='nba'){let home=Math.max(64,Math.round(101+diff*.58+cuRand(-12,12))),away=Math.max(64,Math.round(101-diff*.43+cuRand(-12,12)));if(home===away)home+=2;return[home,away]}
 if(cu.sport==='nfl'){let home=Math.max(0,Math.round(22+diff*.38+cuRand(-10,10))),away=Math.max(0,Math.round(22-diff*.31+cuRand(-10,10)));if(home===away)home+=3;return[home,away]}
 let home=Math.max(0,Math.round(1.6+diff*.07+cuRand(-1,2))),away=Math.max(0,Math.round(1.55-diff*.052+cuRand(-1,2)));return[home,away]};
const _erResultBeforeStats=cuResult;
cuResult=function(matches){_erResultBeforeStats(matches);const cards=document.querySelectorAll('.career-game-screen');cards.forEach((card,i)=>{const m=matches[i],a=m.scores[0],b=m.scores[1];if(!m)return;const seed=erStableHash(cu.year+'-'+cu.week+'-'+cu.sport+'-'+i);let rows=cu.sport==='nba'?[['FG%',(40+seed%16)+'%',(38+(seed>>>3)%17)+'%'],['Rebounds',34+(seed>>>6)%20,33+(seed>>>12)%22],['Assists',15+(seed>>>9)%15,14+(seed>>>16)%16]]:cu.sport==='nfl'?[['Total Yards',240+seed%220,230+(seed>>>6)%240],['Turnovers',seed%3,(seed>>>3)%3],['Third Down',Math.floor(seed%65)+'%',Math.floor((seed>>>5)%65)+'%']]:[['Shots on Target',a+2+seed%5,b+2+(seed>>>6)%5],['Possession',(42+seed%17)+'%',(58-seed%17)+'%'],['Expected Goals',(a*.7+.6).toFixed(1),(b*.7+.6).toFixed(1)]];
 const panel=document.createElement('div');panel.className='er-match-stats';panel.innerHTML=`<h4>📊 Simulated game stats</h4>${rows.map(([k,x,y])=>`<div><b>${x}</b><span>${k}</span><b>${y}</b></div>`).join('')}`;card.append(panel)});
 const feed=document.querySelector('.career-feed');if(feed&&cu.lastChoices){let options=CU_LEAGUES[cu.sport].actions;let line=Array.from({length:cu.players==='two'?2:1},(_,i)=>`P${i+1}: ${options[cu.lastChoices[i]]||'Balanced'} · ${cu.tactics[i]}`).join(' | ');feed.prepend(Object.assign(document.createElement('div'),{textContent:'📋 Tactical decisions: '+line}))}
};
const _erSimBeforeDetail=cuSimulateWeek;
cuSimulateWeek=function(){cu.lastChoices={...cuDecision};_erSimBeforeDetail()};
const _erBaseCameos=cuPeopleHere;
cuPeopleHere=function(stage){return _erBaseCameos(stage).map(p=>({...p,place:p.place||p.school||'Public high-school record',note:p.note||'Publicly listed athlete; school affiliation may change'}))};

go('home');
