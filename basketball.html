function resolvePossession(){var c=state.coach;if(!c||c.finished)return;var home=c.possession==='home',off=home?c.home:c.away,def=home?c.away:c.home;var diff=avgTeam(off)-avgTeam(def),bonus={'Pick & Roll':.045,'Floppy':.025,'Isolation':.005,'Post Up':.02,'Motion':.035}[c.play]||0;var tactic={'Balanced':0,'Pace & Space':.025,'Rim Pressure':.02,'2–3 Zone':-.015,'Switch':-.01,'Full Press':-.025}[c.tactic]||0;var chance=clamp(.44+diff*.012+bonus+tactic,.25,.68);var roll=Math.random();var who=off[Math.floor(Math.random()*off.length)];if(roll<chance){var three=Math.random()<(c.play==='Floppy'||c.tactic==='Pace & Space'?.43:.32);var pts=three?3:2;if(home)c.hs+=pts;else c.as+=pts;logCoach(who.name+' scores '+pts+' points · '+c.play+'.')}else if(roll<chance+.11){logCoach(who.name+' turns it over. Defensive stop.')}else{logCoach(who.name+' misses. '+def[Math.floor(Math.random()*def.length)].name+' secures the rebound.')}c.possession=home?'away':'home';c.tick++;if(c.format==='blacktop'&&(c.hs>=11||c.as>=11)){c.finished=true;c.paused=true;logCoach((c.hs>c.as?'Your squad wins ':'CPU wins ')+c.hs+'–'+c.as+'. Blacktop final.');updateScore();return}if(c.clock<=0&&c.format!=='blacktop'){if(c.period<4){c.period++;c.clock=720;logCoach('End of quarter. Start of Q'+c.period+'.')}else if(c.hs===c.as){c.period++;c.clock=300;logCoach('Tie game. Overtime begins.')}else{c.finished=true;c.paused=true;logCoach((c.hs>c.as?'ERA RIVALS wins ':'CPU wins ')+c.hs+'–'+c.as+'. Final score.')}}updateScore()}

function tickCoach(){var c=state.coach;if(!c||c.paused||c.finished)return;if(c.format!=='blacktop'){c.clock-=12*c.speed;if(c.clock<0)c.clock=0}c.tick++;if(c.tick%2===0)resolvePossession();updateScore();drawCoach()}

+18,b.y-17);g.lineTo(b.x+18,b.y-3);g.stroke()}

function saveBuild(){var name=$('#buildName').value.trim()||'My Hooper',position=$('#buildPos').value,height=Number($('#buildHeight').value),weight=Number($('#buildWeight').value),base=avgBuild(state.picks),ovr=physAdjust(base,position,height,weight);var b={id:'build-'+Date.now(),name:name,pos:position,height:height,weight:weight,ovr:ovr,base:base,picks:state.picks,era:state.era,created:dateKey()};state.builds.unshift(b);store('er_basket_builds',state.builds);state.records.push({date:dateKey(),mode:state.mode,ovr:ovr});store('er_basket_records',state.records);state.passXp+=100;store('er_basket_passxp',state.passXp);notify('Build saved · +100 Builder Pass XP.');setView('career')}
function startCareer(){var radio=$('input[name="careerBuild"]:checked');if(!radio){notify('Select a saved build first.');return}var b=state.builds[Number(radio.value)],team=$('#careerTeam').value,era=$('#careerEra').value;state.career={name:b.name,pos:b.pos,height:b.height,weight:b.weight,ovr:b.ovr,team:team,era:era,year:Number(era.slice(0,4))+1,seasons:[],wins:0,rings:0,awards:0,xp:0,buildId:b.id};store('er_basket_career',state.career);notify('Pro career started. Welcome to '+team+'.');setView('career')}
function nextCareerSeason(){var c=state.career;if(!c)return;var seed=seeded(c.name+c.year+c.team),ovr=c.ovr,pace=c.era==='1980s'?1.04:c.era==='1990s'?1.02:c.era==='2000s'?1.01:1;var wins=clamp(Math.round(25+(ovr-80)*1.25+(seed()-.5)*14),18,67);var ppg=clamp((8+(ovr-72)*.62+(seed()-.5)*5)*pace,7,38),rpg=clamp(2+(c.height-72)*.22+(seed()-.5)*3,1,16),apg=clamp((c.pos==='PG'?4.2:c.pos==='SG'?2.8:2.1)+(ovr-80)*.11+(seed()-.5)*2,1,14);var award=ppg>27&&wins>50?'MVP':ppg>22?'All-NBA':wins>55?'Top seed':'—';var ring=wins>53&&seed()<.36;var s={year:c.year,wins:wins,ppg:ppg.toFixed(1),rpg:rpg.toFixed(1),apg:apg.toFixed(1),fg:clamp(43+(ovr-80)*.45+(seed()-.5)*4,35,65).toFixed(1),three:clamp(31+(skillFromCareer(c,'three')-70)*.42+(seed()-.5)*5,20,52).toFixed(1),award:ring?(award==='—'?'Champion':award+' · Champion'):award,note:ring?'Won the NBA championship. Your name goes in the record book.':wins>=50?'Strong playoff season. The title run fell short.':'A development year. Improve the build and make another run.'};c.seasons.push(s);c.wins+=wins;c.xp+=wins*10+ovr*3;state.passXp+=Math.round(wins*2);store('er_basket_passxp',state.passXp);if(ring)c.rings++;if(award!=='—')c.awards++;c.year+=1;if(c.ovr<98&&c.xp%2===0)c.ovr++;store('er_basket_career',c);notify('Season '+s.year+' complete. '+wins+' wins'+(ring?' and a championship!':'.'));render()}
function skillFromCareer(c,k){var b=state.builds.find(function(x){return x.id===c.buildId});return b&&b.picks&&b.picks[k]?skill(b.picks[k],k):c.ovr}
function trainCareer(){var c=state.career;if(!c)return;if(c.xp<100){notify('You need 100 career XP to train.');return}c.xp-=100;c.ovr=clamp(c.ovr+1,40,99);store('er_basket_career',c);notify('Training complete. +1 OVR.');render()}
function runSeason(){var selected=$('#seasonTeam').value,era=$('#seasonEra').value;var rows=teams.map(function(t){var power=78+(hash(t+era)%1400)/100;var seed=seeded(t+era+dateKey());var wins=clamp(Math.round(41+(power-85)*2.1+(seed()-.5)*18),15,68);return {team:t,power:power,wins:wins}}).sort(function(a,b){return b.wins-a.wins||b.power-a.power});var playoff=rows.slice(0,8);var champ=playoff[0];for(var i=1;i<playoff.length;i++){if(Math.random()<.38+(playoff[i].power-champ.power)*.025)champ=playoff[i]}state.season={name:era+' NBA Season',rows:rows,champion:champ.team,selected:selected};render()}
function notify(msg){var t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#c9f36b;color:#111;padding:12px 18px;border-radius:9px;font-weight:800;font-size:12px;z-index:100;box-shadow:0 10px 35px #0008';document.body.appendChild(t)}t.textContent=msg;t.style.opacity='1';clearTimeout(notify.timer);notify.timer=setTimeout(function(){t.style.opacity='0'},2300)}
function pickPlayer(id){var cat=categories[state.round],p=players.find(function(x){return x.id===id});if(!p)return;state.picks[cat.id]=p;state.used.push(p.id);state.round++;if(state.round<9)state.offers=makeOffers();render()}
function saveAuction(){var a=state.auction;var obj={id:'lineup-'+Date.now(),name:'Salary Cap Five',pos:'TEAM',ovr:Math.round(a.picks.reduce(function(s,p){return s+p.rating},0)/5),height:75,weight:205,picks:{},created:dateKey(),lineup:a.picks};state.builds.unshift(obj);store('er_basket_builds',state.builds);state.passXp+=80;store('er_basket_passxp',state.passXp);notify('Five-man lineup saved · +80 Builder Pass XP.');setView('records')}
function gridCheck(){var clues=[function(p){return p.pos.includes('PG')},function(p){return p.season>=1990&&p.season<2000},function(p){return p.team.includes('Lakers')},function(p){return p.pos.includes('C')},function(p){return p.season>=2010&&p.season<2020},function(p){return p.team.includes('Warriors')},function(p){return p.team.includes('Bulls')},function(p){return p.season>=2000&&p.season<2010},function(p){return p.pos.includes('SF')}];var score=0;for(var i=0;i<9;i++){var val=$('#grid'+i).value.trim().toLowerCase(),p=players.find(function(x){return x.name.toLowerCase()===val});if(p&&clues[i](p)){score++;$('#grid'+i).style.borderColor='#c9f36b'}else $('#grid'+i).style.borderColor='#e97835'}$('#gridResult').textContent='You got '+score+'/9 correct.';if(score===9)notify('Perfect grid. Badge unlocked!')}
function exportSave(){var data={builds:state.builds,career:state.career,records:state.records};var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='era-rivals-basketball-save.json';a.click();URL.revokeObjectURL(url)}
function act(a,b){var c=state.coach;if(a==='start-build')startBuild(b.mode==='current'?'current':b.mode==='alltime'?'alltime':b.mode||'classic',b.mode==='current'?'current':'all');if(a==='era'){state.era=b.era;state.offers=makeOffers();render()}if(a==='blind'){state.mode=state.mode==='blind'?'classic':'blind';render()}if(a==='restart-build')startBuild(state.mode,state.era);if(a==='save-build')saveBuild();if(a==='auction')startAuction();if(a==='start-squad')startSquad();if(a==='save-squad')saveSquad();if(a==='start-blacktop'){startCoachState('blacktop',Number(b.size)||state.blacktopSize||3);setView('coach');}if(a==='blacktop-size'){state.blacktopSize=Number(b.size)||3;render()}if(a==='submit-pickem'){if(!state.pickem.games.every(function(g){return g.pick})){notify('Pick a winner for all four games.');return}var score=0;state.pickem.games.forEach(function(g){var r=Math.random(),prob=g.pa/(g.pa+g.pb);g.winner=r<prob?g.a:g.b;if(g.pick===g.winner)score++});state.pickem.score=score;state.pickem.done=true;if(score===4){state.passXp+=100;store('er_basket_passxp',state.passXp)}render()}if(a==='new-pickem'){state.pickem=null;setView('pickem')}if(a==='pickem'&&state.pickem&&!state.pickem.done){var game=state.pickem.games[Number(b.game)];if(game)game.pick=b.team==='a'?game.a:game.b;render()}if(a==='save-auction')saveAuction();if(a==='start-career')startCareer();if(a==='next-season')nextCareerSeason();if(a==='train')trainCareer();if(a==='end-career'){state.career=null;store('er_basket_career',null);setView('career')}if(a==='run-season')runSeason();if(a==='season-again'){state.season=null;setView('season')}if(a==='check-grid')gridCheck();if(a==='export')exportSave();if(a==='reset'){if(confirm('Delete local basketball builds, career and records?')){['er_basket_builds','er_basket_career','er_basket_records'].forEach(function(k){localStorage.removeItem(k)});state.builds=[];state.career=null;state.records=[];render()}}if(a==='pause'&&c){c.paused=!c.paused;render()}if(a==='speed'&&c){c.speed=Number(b.speed)||1;notify('Simulation speed: '+c.speed+'×')}if(a==='play'&&c){c.play=b.play;notify('Play called: '+c.play);render()}if(a==='tactic'&&c){c.tactic=b.tactic;notify('Tactic changed: '+c.tactic);render()}if(a==='timeout'&&c){if(c.timeouts>0){c.timeouts--;c.paused=true;logCoach('Timeout called. Set the next play and lineup.');render()}else notify('No timeouts remaining.')}if(a==='possession'&&c){resolvePossession();drawCoach()}if(a==='sub'&&c){var id=$('#subPlayer').value,position=$('#subPos').value,bench=c.bench.find(function(p){return p.id===id}),idx=c.home.findIndex(function(p){return p.pos.includes(position)});if(bench&&idx>=0){var old=c.home[idx];c.home[idx]=bench;c.bench=c.bench.filter(function(p){return p.id!==id});c.bench.push(old);logCoach('Substitution: '+bench.name+' checks in for '+old.name+'.');render();drawCoach()}}}
app.addEventListener('change',function(e){if(e.target&&e.target.id==='eraFilter'){state.era=e.target.value;state.offers=makeOffers();render()}});
app.addEventListener('click',function(e){var b=e.target.closest('[data-act],[data-view],[data-pick],[data-auction],[data-squad]');if(!b)return;if(b.dataset.view){setView(b.dataset.view);return}if(b.dataset.pick){pickPlayer(b.dataset.pick);return}if(b.dataset.squad){pickSquad(b.dataset.squad);return}if(b.dataset.auction){var p=players.find(function(x){return x.id===b.dataset.auction}),a=state.auction;if(p&&a&&playerCost(p)<=a.budget-a.spent){a.picks.push(p);a.spent+=playerCost(p);a.round++;if(a.round<5)a.offers=auctionOffers();render()}else notify('That player is over the remaining cap.');return}act(b.dataset.act,b.dataset)});
